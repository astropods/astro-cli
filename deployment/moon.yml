# Docker image builds. Used by `ast dev --local` and CI.
tasks:
  "collector":
    command: "cd .. && docker build -t collector:latest -f deployment/Dockerfile.astro-collector packages/astro-collector && docker tag collector:latest astropods/collector:latest"
    options:
      cache: false
      runInCI: false

  "messaging":
    command: "cd .. && docker build -t messaging:latest -f modules/messaging/Dockerfile modules/messaging && docker tag messaging:latest astropods/messaging:latest"
    options:
      cache: false
      runInCI: false

  "playground":
    command: "cd .. && docker build -t playground:latest -f modules/playground/Dockerfile modules/playground"
    options:
      cache: false
      runInCI: false

  "astro-client":
    command: "cd .. && docker build -t astro-client:latest -f deployment/Dockerfile.astro-client ."
    options:
      cache: false
      runInCI: false

  "smoke-test-astro-client":
    command: "cd .. && bash deployment/smoke-test-astro-client.sh"
    options:
      cache: false
      runInCI: false

  "astro-server":
    command: "cd .. && docker build -t astro-server:latest -f deployment/Dockerfile.astro-server ."
    options:
      cache: false
      runInCI: false

  "astro-registry":
    command: "cd .. && docker build -t astro-registry:latest -f deployment/Dockerfile.astro-registry ."
    options:
      cache: false
      runInCI: false

  "clean":
    command: "docker rmi astro-client:latest astro-server:latest astro-registry:latest astropods/collector:latest messaging:latest playground:latest astropods/astro-server:latest astropods/astro-registry:latest astropods/astro-messaging:latest astropods/astro-playground:latest 2>/dev/null || true"
    options:
      runInCI: false
