# Docker image builds (context = workspace root). Used by `ast dev --local` and CI.
tasks:
  "messaging":
    command: "cd .. && docker build -t astro-messaging:latest -f deployment/Dockerfile.astro-messaging ."
    options:
      cache: false
      runInCI: false

  "playground":
    command: "cd .. && docker build -t astro-playground:latest -f deployment/Dockerfile.astro-playground ."
    options:
      cache: false
      runInCI: false

  "clean":
    command: "docker rmi astro-messaging:latest astro-server:latest astro-registry:latest astro-playground:latest ghcr.io/saswatds/astro-messaging:latest ghcr.io/saswatds/astro-server:latest ghcr.io/saswatds/astro-registry:latest ghcr.io/saswatds/astro-playground:latest 2>/dev/null || true"
    options:
      runInCI: false
