name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      product-code: ${{ steps.filter.outputs.product-code }}
      bun: ${{ steps.filter.outputs.bun }}
      go: ${{ steps.filter.outputs.go }}
      go-cli: ${{ steps.filter.outputs.go-cli }}
      go-server: ${{ steps.filter.outputs.go-server }}
      docker-client: ${{ steps.filter.outputs.docker-client }}
      cli-chat-embed: ${{ steps.filter.outputs.cli-chat-embed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Application/source changes only — excludes CLI VERSION bumps and
            # .github workflow edits so release/CI-only PRs do not fan out.
            product-code:
              - 'apps/astro-client/**'
              - 'apps/astro-server/**'
              - 'apps/astro-registry/**'
              - 'apps/astro-queen/**'
              - 'apps/astro-otel/**'
              - 'modules/astro-cli/!(VERSION)/**'
              - 'modules/astro-cli/!(VERSION)'
              - 'packages/**'
              - 'sql/**'
              - 'bun.lock'
              - 'package.json'
              - 'deployment/**'
            bun:
              - 'apps/astro-client/**'
              - 'packages/astro-theme/**'
              - 'packages/astro-trading-card/**'
              - 'packages/astro-proto/**'
              - 'bun.lock'
              - 'package.json'
            go:
              - 'apps/astro-server/**'
              - 'apps/astro-registry/**'
              - 'apps/astro-otel/**'
              - 'modules/astro-cli/!(VERSION)/**'
              - 'modules/astro-cli/!(VERSION)'
              - 'apps/astro-queen/**'
              - 'packages/astro-spec/**'
              - 'packages/astro-proto/**'
            go-cli:
              - 'modules/astro-cli/!(VERSION)/**'
              - 'modules/astro-cli/!(VERSION)'
              - 'packages/astro-spec/**'
            # The CLI embeds astro-client's chat SPA (//go:embed webdist). Run the
            # embed smoke test when the CLI OR the chat source it bundles changes.
            # Keep the chat globs in sync with bump-cli-on-chat-change.yml.
            cli-chat-embed:
              - 'modules/astro-cli/!(VERSION)/**'
              - 'modules/astro-cli/!(VERSION)'
              - 'packages/astro-spec/**'
              - 'apps/astro-client/src/pages/chat/**'
              - 'apps/astro-client/src/components/chat/**'
              - 'apps/astro-client/src/components/assistant-ui/**'
              - 'apps/astro-client/src/hooks/use-deployment-chat.ts'
              - 'apps/astro-client/src/hooks/use-chat-sessions.ts'
              - 'apps/astro-client/src/api/queries/chat.ts'
              - 'apps/astro-client/src/lib/chat/**'
              - 'apps/astro-client/src/lib/messaging/**'
              - 'apps/astro-client/src/chat-embed/**'
              - 'apps/astro-client/chat-embed.html'
              - 'apps/astro-client/vite.chat-embed.config.ts'
            go-server:
              - 'apps/astro-server/**'
              - 'packages/astro-spec/**'
              - 'sql/**'
            docker-client:
              - 'deployment/Dockerfile.astro-client'
              - 'apps/astro-client/package.json'
              - 'packages/astro-theme/package.json'
              - 'packages/astro-trading-card/package.json'
              - 'bun.lock'
              - 'package.json'

  test-bun:
    needs: changes
    if: needs.changes.outputs.product-code == 'true' && needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    name: Test Bun packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (astro-client)
        run: bun x moon run astro-client:lint

      - name: Run tests
        run: bun run test
        working-directory: apps/astro-client

  test-go:
    needs: changes
    if: needs.changes.outputs.product-code == 'true' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    name: Test Go applications
    strategy:
      matrix:
        app:
          - name: astro-spec
            path: packages/astro-spec
          - name: astro-proto
            path: packages/astro-proto
          - name: astro-server
            path: apps/astro-server
          - name: astro-registry
            path: apps/astro-registry
          - name: astro-otel
            path: apps/astro-otel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch astro-spec submodule
        if: matrix.app.name == 'astro-spec' || matrix.app.name == 'astro-server'
        run: git submodule update --init packages/astro-spec

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.app.path }}/go.sum

      - name: Install dependencies
        working-directory: ${{ matrix.app.path }}
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: ${{ matrix.app.path }}
          args: --timeout=10m

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        working-directory: ${{ matrix.app.path }}
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            gotestsum --format pkgname -- -race -coverprofile=coverage.out ./...
          else
            gotestsum --format pkgname -- ./...
          fi

      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: go build -v ./...

  test-go-integration:
    needs: changes
    if: needs.changes.outputs.product-code == 'true' && needs.changes.outputs.go-server == 'true'
    runs-on: ubuntu-latest
    name: Integration tests (astro-server + Postgres)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/astro?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch astro-spec submodule
        run: git submodule update --init packages/astro-spec

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/astro-server/go.sum

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      - name: Apply schema migration
        run: |
          atlas schema apply \
            --url "$DATABASE_URL" \
            --to file://sql/astro-server/schema.sql \
            --dev-url "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
            --exclude "atlas_schema_revisions" --exclude "river" \
            --auto-approve

      - name: Apply River migrations
        run: |
          atlas migrate apply \
            --url "$DATABASE_URL" \
            --dir file://sql/river \
            --revisions-schema atlas_schema_revisions \
            --allow-dirty

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      # ./internal/... too: several packages there test SQL against a real
      # database and skip themselves without DATABASE_URL, so the unit job runs
      # them as no-ops. This is the job that has one.
      - name: Run integration tests
        working-directory: apps/astro-server
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            gotestsum --format pkgname -- -tags integration -race ./e2e/... ./internal/...
          else
            gotestsum --format pkgname -- -tags integration ./e2e/... ./internal/...
          fi

  test-go-k8s:
    needs: changes
    if: needs.changes.outputs.product-code == 'true' && needs.changes.outputs.go-server == 'true'
    runs-on: ubuntu-latest
    name: K8s integration tests (vcluster + Postgres)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/astro?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch astro-spec submodule
        run: git submodule update --init packages/astro-spec

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/astro-server/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      - name: Apply schema migration
        run: |
          atlas schema apply \
            --url "$DATABASE_URL" \
            --to file://sql/astro-server/schema.sql \
            --dev-url "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
            --exclude "atlas_schema_revisions" --exclude "river" \
            --auto-approve

      - name: Apply River migrations
        run: |
          atlas migrate apply \
            --url "$DATABASE_URL" \
            --dir file://sql/river \
            --revisions-schema atlas_schema_revisions \
            --allow-dirty

      - name: Create kind cluster (host)
        run: |
          curl -Lo kind "https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/
          kind create cluster --name vcluster-host --wait 60s

      - name: Install vcluster CLI
        run: |
          curl -fL -o vcluster "https://github.com/loft-sh/vcluster/releases/download/v0.34.0/vcluster-linux-amd64"
          chmod +x vcluster
          sudo mv vcluster /usr/local/bin/

      - name: Create vcluster
        run: |
          vcluster create e2e-test --connect=false
          vcluster connect e2e-test --update-current=false --kube-config=/tmp/vcluster-kubeconfig.yaml
          echo "KUBECONFIG=/tmp/vcluster-kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Wait for vcluster API server
        run: |
          for i in $(seq 1 30); do
            if kubectl --kubeconfig=/tmp/vcluster-kubeconfig.yaml cluster-info >/dev/null 2>&1; then
              echo "vcluster API server ready"
              exit 0
            fi
            echo "Waiting for vcluster... ($i/30)"
            sleep 2
          done
          echo "vcluster did not become ready"
          exit 1

      - name: Run K8s integration tests
        working-directory: apps/astro-server
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            gotestsum --format pkgname -- -tags k8s -race -timeout 5m ./e2e/...
          else
            gotestsum --format pkgname -- -tags k8s -timeout 5m ./e2e/...
          fi

  test-client-e2e:
    needs: changes
    if: needs.changes.outputs.product-code == 'true' && needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    name: Client E2E tests (Playwright) [shard ${{ matrix.shard }}/4]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browser dependencies
        working-directory: apps/astro-client
        run: bunx playwright install --with-deps chromium

      - name: Run client E2E tests
        run: bun x moon run astro-client:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/astro-client/playwright-report
            apps/astro-client/test-results
          if-no-files-found: ignore

  test-client-docker:
    needs: changes
    if: needs.changes.outputs.product-code == 'true' && needs.changes.outputs.docker-client == 'true'
    runs-on: ubuntu-latest
    name: Docker smoke test (astro-client)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and smoke-test astro-client image
        run: bash deployment/smoke-test-astro-client.sh

  codec-collision-guard:
    runs-on: ubuntu-latest
    name: Codec collision guard (astro-proto)
    # Always runs — no path filter — because the cost of letting a codec
    # rename slip through is too high (see
    # docs/changelog/fix/grpc-codec-name-collision-2026-06-10.md).
    steps:
      - uses: actions/checkout@v4
      - name: Forbid built-in codec names in astro-proto
        run: |
          set -euo pipefail
          # Naming a custom gRPC codec after a built-in ("proto", "json",
          # "gzip", etc) overrides the global registry process-wide for every
          # binary that imports the package. The internal tests in
          # admin/v1/codec_test.go and connect/v1/codec_test.go cover the
          # current "json" codec; this grep is belt + suspenders against any
          # NEW codec re-introducing the same footgun.
          matches=$(grep -rnE 'func \(.*\) Name\(\) string.*return "(proto|gzip|identity)"' packages/astro-proto --include='*.go' || true)
          if [ -n "$matches" ]; then
            echo "::error::Custom gRPC codec named after a built-in detected in packages/astro-proto:"
            echo "$matches"
            echo
            echo "Pick a unique name and have clients opt in via grpc.CallContentSubtype(...)."
            echo "See docs/changelog/fix/grpc-codec-name-collision-2026-06-10.md"
            exit 1
          fi

  ci-gate:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - codec-collision-guard
      - test-bun
      - test-go
      - test-go-integration
      - test-go-k8s
      - test-client-e2e
      - test-client-docker
    steps:
      - name: Check results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "Job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"