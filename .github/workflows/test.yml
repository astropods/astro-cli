name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-bun:
    runs-on: ubuntu-latest
    name: Test Bun packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test
        working-directory: apps/astro-client

  test-go:
    runs-on: ubuntu-latest
    name: Test Go applications
    strategy:
      matrix:
        app:
          - name: astro-spec
            path: packages/astro-spec
          - name: astro-server
            path: apps/astro-server
          - name: astro-registry
            path: apps/astro-registry
          - name: astro-cli
            path: apps/astro-cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.app.path }}/go.sum

      - name: Install dependencies
        working-directory: ${{ matrix.app.path }}
        run: go mod download

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run golangci-lint
        working-directory: ${{ matrix.app.path }}
        run: golangci-lint run ./...

      - name: Run go vet
        working-directory: ${{ matrix.app.path }}
        run: go vet ./...

      - name: Run tests
        working-directory: ${{ matrix.app.path }}
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            gotestsum --format pkgname -- -race -coverprofile=coverage.out ./...
          else
            gotestsum --format pkgname -- ./...
          fi

      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: go build -v ./...
