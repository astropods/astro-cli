name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bun: ${{ steps.filter.outputs.bun }}
      go: ${{ steps.filter.outputs.go }}
      go-cli: ${{ steps.filter.outputs.go-cli }}
      go-server: ${{ steps.filter.outputs.go-server }}
      docker-client: ${{ steps.filter.outputs.docker-client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bun:
              - 'apps/astro-client/**'
              - 'packages/astro-theme/**'
              - 'packages/astro-trading-card/**'
              - 'packages/astro-proto/**'
              - 'bun.lock'
              - 'package.json'
              - '.github/workflows/test.yml'
            go:
              - 'apps/astro-server/**'
              - 'apps/astro-registry/**'
              - 'apps/astro-cli/**'
              - 'apps/astro-queen/**'
              - 'packages/astro-spec/**'
              - '.github/workflows/test.yml'
            go-cli:
              - 'apps/astro-cli/**'
              - 'packages/astro-spec/**'
              - '.github/workflows/test.yml'
            go-server:
              - 'apps/astro-server/**'
              - 'packages/astro-spec/**'
              - 'sql/**'
              - '.github/workflows/test.yml'
            docker-client:
              - 'deployment/Dockerfile.astro-client'
              - 'apps/astro-client/package.json'
              - 'packages/astro-theme/package.json'
              - 'packages/astro-trading-card/package.json'
              - 'bun.lock'
              - 'package.json'
              - '.github/workflows/test.yml'

  test-bun:
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    name: Test Bun packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (astro-client)
        run: bun x moon run astro-client:lint

      - name: Run tests
        run: bun run test
        working-directory: apps/astro-client

  test-go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    name: Test Go applications
    strategy:
      matrix:
        app:
          - name: astro-spec
            path: packages/astro-spec
          - name: astro-server
            path: apps/astro-server
          - name: astro-registry
            path: apps/astro-registry
          - name: astro-cli
            path: apps/astro-cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.app.path }}/go.sum

      - name: Install dependencies
        working-directory: ${{ matrix.app.path }}
        run: go mod download

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run golangci-lint
        working-directory: ${{ matrix.app.path }}
        run: golangci-lint run ./...

      - name: Run go vet
        working-directory: ${{ matrix.app.path }}
        run: go vet ./...

      - name: Run tests
        working-directory: ${{ matrix.app.path }}
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            gotestsum --format pkgname -- -race -coverprofile=coverage.out ./...
          else
            gotestsum --format pkgname -- ./...
          fi

      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: go build -v ./...

  test-cli-integration:
    needs: changes
    if: needs.changes.outputs.go-cli == 'true'
    runs-on: ubuntu-latest
    name: CLI integration tests (ast create + docker build)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/astro-cli/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run CLI integration tests
        working-directory: apps/astro-cli
        run: gotestsum --format pkgname -- -tags integration ./e2e/...

  test-go-integration:
    needs: changes
    if: needs.changes.outputs.go-server == 'true'
    runs-on: ubuntu-latest
    name: Integration tests (astro-server + Postgres)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/astro?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/astro-server/go.sum

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      - name: Apply schema migration
        run: |
          atlas schema apply \
            --url "$DATABASE_URL" \
            --to file://sql/astro-server/schema.sql \
            --dev-url "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
            --exclude "atlas_schema_revisions" --exclude "river" \
            --auto-approve

      - name: Apply River migrations
        run: |
          atlas migrate apply \
            --url "$DATABASE_URL" \
            --dir file://sql/river \
            --revisions-schema atlas_schema_revisions \
            --allow-dirty

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run integration tests
        working-directory: apps/astro-server
        run: gotestsum --format pkgname -- -tags integration -race ./e2e/...

  test-go-k8s:
    needs: changes
    if: needs.changes.outputs.go-server == 'true'
    runs-on: ubuntu-latest
    name: K8s integration tests (vcluster + Postgres)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/astro?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/astro-server/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      - name: Apply schema migration
        run: |
          atlas schema apply \
            --url "$DATABASE_URL" \
            --to file://sql/astro-server/schema.sql \
            --dev-url "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
            --exclude "atlas_schema_revisions" --exclude "river" \
            --auto-approve

      - name: Apply River migrations
        run: |
          atlas migrate apply \
            --url "$DATABASE_URL" \
            --dir file://sql/river \
            --revisions-schema atlas_schema_revisions \
            --allow-dirty

      - name: Create kind cluster (host)
        run: |
          curl -Lo kind "https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/
          kind create cluster --name vcluster-host --wait 60s

      - name: Install vcluster CLI
        run: |
          curl -fL -o vcluster "https://github.com/loft-sh/vcluster/releases/download/v0.34.0/vcluster-linux-amd64"
          chmod +x vcluster
          sudo mv vcluster /usr/local/bin/

      - name: Create vcluster
        run: |
          vcluster create e2e-test --connect=false
          vcluster connect e2e-test --update-current=false --kube-config=/tmp/vcluster-kubeconfig.yaml
          echo "KUBECONFIG=/tmp/vcluster-kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Wait for vcluster API server
        run: |
          for i in $(seq 1 30); do
            if kubectl --kubeconfig=/tmp/vcluster-kubeconfig.yaml cluster-info >/dev/null 2>&1; then
              echo "vcluster API server ready"
              exit 0
            fi
            echo "Waiting for vcluster... ($i/30)"
            sleep 2
          done
          echo "vcluster did not become ready"
          exit 1

      - name: Run K8s integration tests
        working-directory: apps/astro-server
        run: gotestsum --format pkgname -- -tags k8s -race -timeout 5m ./e2e/...

  test-client-e2e:
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    name: Client E2E tests (Playwright)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browser dependencies
        working-directory: apps/astro-client
        run: bunx playwright install --with-deps chromium

      - name: Run client E2E tests
        run: bun x moon run astro-client:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/astro-client/playwright-report
            apps/astro-client/test-results
          if-no-files-found: ignore

  test-client-docker:
    needs: changes
    if: needs.changes.outputs.docker-client == 'true'
    runs-on: ubuntu-latest
    name: Docker smoke test (astro-client)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and smoke-test astro-client image
        run: bash deployment/smoke-test-astro-client.sh

  ci-gate:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test-bun
      - test-go
      - test-cli-integration
      - test-go-integration
      - test-go-k8s
      - test-client-e2e
      - test-client-docker
    steps:
      - name: Check results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "Job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
