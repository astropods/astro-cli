name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-bun:
    runs-on: ubuntu-latest
    name: Test Bun packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test
        working-directory: apps/astro-client

  test-astro-messaging:
    runs-on: ubuntu-latest
    name: Test astro-messaging (TS + Go cross-language)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: packages/astro-messaging/go.sum

      - name: Install dependencies
        run: bun install

      - name: Generate Go serialized test data
        working-directory: packages/astro-messaging
        run: go run tools/test-serialization/main.go serialize

      - name: Run TypeScript tests
        working-directory: packages/astro-messaging
        run: bun test

      - name: Verify Go can deserialize TypeScript output
        working-directory: packages/astro-messaging
        run: go run tools/test-serialization/main.go deserialize

      - name: Run Go tests
        working-directory: packages/astro-messaging
        run: go test -v ./...

  test-go:
    runs-on: ubuntu-latest
    name: Test Go applications
    strategy:
      matrix:
        app:
          - name: astro-server
            path: apps/astro-server
          - name: astro-registry
            path: apps/astro-registry
          - name: astro-cli
            path: apps/astro-cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.app.path }}/go.sum

      - name: Install dependencies
        working-directory: ${{ matrix.app.path }}
        run: go mod download

      - name: Run go vet
        working-directory: ${{ matrix.app.path }}
        run: go vet ./...

      - name: Run tests
        working-directory: ${{ matrix.app.path }}
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Full test suite with race detection and coverage on main branch
            go test -v -race -coverprofile=coverage.out ./...
          else
            # Fast tests for PRs (no race detector)
            go test -v ./...
          fi

      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: go build -v ./...
