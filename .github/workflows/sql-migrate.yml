name: SQL Migrate (Prod)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Plan: show exactly what SQL will run against production (no changes made)
  # ---------------------------------------------------------------------------
  plan:
    runs-on: prod-astro-runner
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      - name: Schema diff
        run: |
          DIFF=$(atlas schema diff \
            --from "$DATABASE_URL" \
            --to "file://sql/astro-server/schema.sql" \
            --dev-url "postgres://postgres:dev@localhost:5432/dev?sslmode=disable" \
            --exclude "atlas_schema_revisions" --exclude "river" 2>&1) || true

          if [ -z "$DIFF" ]; then
            echo "### Declarative Schema" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> No changes — production already matches \`schema.sql\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Declarative Schema" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```sql' >> "$GITHUB_STEP_SUMMARY"
            echo "$DIFF" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: River migration status
        run: |
          STATUS=$(atlas migrate status \
            --url "$DATABASE_URL" \
            --dir "file://sql/river" \
            --revisions-schema atlas_schema_revisions 2>&1) || true

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### River Migrations" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate: require manual approval before applying migrations
  # ---------------------------------------------------------------------------
  approve:
    needs: [plan]
    runs-on: ubuntu-latest
    environment: gate
    steps:
      - name: Approved
        run: echo "Migration approved — proceeding to apply."

  # ---------------------------------------------------------------------------
  # Apply: run migrations (requires manual approval via environment protection)
  # ---------------------------------------------------------------------------
  apply:
    needs: [approve]
    runs-on: prod-astro-runner
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      - name: Apply declarative schema
        run: |
          OUTPUT=$(atlas schema apply \
            --url "$DATABASE_URL" \
            --to "file://sql/astro-server/schema.sql" \
            --dev-url "postgres://postgres:dev@localhost:5432/dev?sslmode=disable" \
            --exclude "atlas_schema_revisions" --exclude "river" \
            --auto-approve 2>&1)

          echo "### Declarative Schema — Applied" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply River migrations
        run: |
          OUTPUT=$(atlas migrate apply \
            --url "$DATABASE_URL" \
            --dir "file://sql/river" \
            --revisions-schema atlas_schema_revisions \
            --allow-dirty 2>&1)

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### River Migrations — Applied" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Notify: post migration status to #astro-ops
  # ---------------------------------------------------------------------------
  notify:
    needs: [apply]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify #astro-ops
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_ASTRO_OPS_CHANNEL_ID }}
            text: "*SQL Migrate (Prod)* — ${{ needs.apply.result == 'success' && '✅ Success' || '❌ Failed' }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    *SQL Migrate (Prod)* — ${{ needs.apply.result == 'success' && '✅ Success' || '❌ Failed' }}
                    *Commit:* `${{ github.sha }}`
                    *Triggered by:* ${{ github.actor }}
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View>
