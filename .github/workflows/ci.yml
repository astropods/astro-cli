name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    name: Build and test
    steps:
      - uses: actions/checkout@v4

      # astro-spec is a public module resolved from the Go proxy, so the default
      # token is enough; no submodule or credential needed.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files; run gofmt -w ."
            echo "$unformatted"
            exit 1
          fi
          echo "OK: all files are gofmt-clean"

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=10m

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./cmd/... ./internal/...

      # The process seam under cmd/chatui_process_*.go only compiles on its own
      # platform, so a Unix-only call reaching cmd/ would not fail the job above.
      - name: Cross-compile every released target
        run: |
          set -euo pipefail
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            echo "::group::$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
            echo "::endgroup::"
          done

      - name: Vet for Windows
        run: GOOS=windows go vet ./...

  # Cross-compiling proves the Windows seam compiles; only running on Windows
  # proves it works. The tests adapt to the platform that built them, so this
  # is the only job that executes chatui_process_windows.go,
  # upgrade_replace_windows.go and docker_endpoint_windows.go at all -- and
  # with them taskkill, tasklist, netstat and the rename-over-a-running-binary
  # dance, none of which a Linux runner can reach.
  windows-test:
    runs-on: windows-latest
    name: Test on Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Scoped to the seam this branch adds, which is what a Windows runner
      # is here to prove: taskkill, tasklist, netstat, Get-CimInstance, the
      # detach flags, and the rename-over-a-running-binary dance.
      #
      # Not the whole suite. 44 call sites across 18 files isolate with
      # t.Setenv("HOME"), but os.UserHomeDir reads USERPROFILE on Windows, so
      # every one of them shares the runner's real profile instead of its own
      # temp dir and they overwrite each other's credentials. Which tests fail
      # therefore depends on which ones ran, so an exclusion list does not
      # converge -- skipping the first twelve simply moved the failure into
      # internal/auth. The product code is correct; the harness is not
      # portable, and fixing it means a helper that sets both variables plus a
      # change to the convention in CLAUDE.md.
      - name: Test the Windows seam
        run: |
          go test ./cmd/... -run '^(TestProcessAlive|TestProcessCommandLine|TestListenerPID|TestChatUIListenerPID|TestDetachProcAttr|TestArtifactSuffix|TestReplaceRunningBinary|TestSweepReplacedBinaries|TestVersionedInstallSupported|TestCheckDockerRunning|TestDockerUnreachableError)' -v
