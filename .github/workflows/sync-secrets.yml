name: Sync Secrets & Config

# Pushes out-of-band configuration without a full deploy:
#   - secrets: 1Password Astro vault -> AWS Secrets Manager (External Secrets
#     mirrors it into the cluster on its own ~5m refresh, so pods pick up new
#     values on their next restart, not immediately).
#   - config:  config/<service>/<env>.env -> <service>-config ConfigMap.
#     Applied directly, so a rollout is enough to make it live. Only services
#     whose ConfigMap data actually changed get restarted.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - preview
          - prod
      sync_secrets:
        description: "Sync secrets from 1Password to Secrets Manager"
        type: boolean
        default: true
      sync_config:
        description: "Apply ConfigMaps from config/<service>/<env>.env"
        type: boolean
        default: true
      restart:
        description: "Roll deployments whose ConfigMap changed"
        type: boolean
        default: true

concurrency:
  group: sync-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  OP_VAULT: Astro

jobs:
  sync-secrets:
    name: Sync secrets from 1Password
    if: inputs.sync_secrets
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.IAM_ROLE_SUFFIX }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync astro-server secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          SECRET_JSON=$(op item get "${{ vars.OP_ITEM_NAME }}" --vault "${{ env.OP_VAULT }}" --format json | \
            jq '[.fields[] | select(.label != null and .value != null and (.label | test("^[A-Z0-9_]+$"))) | {(.label): .value}] | add')
          KEYS=$(echo "$SECRET_JSON" | jq -r 'keys | join(", ")')
          echo "::notice::Syncing astro-server secrets: $KEYS"
          aws secretsmanager put-secret-value \
            --secret-id ${{ vars.SECRETS_MANAGER_PREFIX }}/astro-server/app \
            --secret-string "$SECRET_JSON"
          echo "::notice::astro-server secrets synced. External Secrets mirrors them within ~5m; pods load new values on their next restart."

  sync-config:
    name: Sync ConfigMaps
    if: inputs.sync_config
    # Prod's EKS API is private, so it needs the in-cluster runner; preview
    # reaches the API from a hosted runner via update-kubeconfig.
    runs-on: ${{ inputs.environment == 'prod' && 'prod-astro-runner' || 'ubuntu-latest' }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure AWS credentials
        if: inputs.environment != 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.IAM_ROLE_SUFFIX }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        if: inputs.environment != 'prod'
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Apply ConfigMaps
        id: apply
        run: |
          changed=()
          for dir in config/*/; do
            service=$(basename "$dir")
            config_file="${dir}${{ inputs.environment }}.env"
            if [ ! -f "$config_file" ]; then
              echo "::warning::No $config_file found, skipping $service"
              continue
            fi

            desired=$(kubectl create configmap "$service-config" \
              --from-env-file="$config_file" \
              --namespace="$service" \
              --dry-run=client -o json | jq -S '.data')
            current=$(kubectl get configmap "$service-config" --namespace="$service" -o json 2>/dev/null | jq -S '.data' || true)

            if [ "$desired" == "$current" ]; then
              echo "::notice::$service-config already up to date"
              continue
            fi

            kubectl create configmap "$service-config" \
              --from-env-file="$config_file" \
              --namespace="$service" \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "::notice::ConfigMap updated for $service"
            changed+=("$service")
          done

          echo "changed=${changed[*]}" >> "$GITHUB_OUTPUT"
          if [ ${#changed[@]} -eq 0 ]; then
            echo "::notice::No ConfigMap changes to roll out"
          fi

      - name: Restart changed deployments
        if: inputs.restart && steps.apply.outputs.changed != ''
        run: |
          for service in ${{ steps.apply.outputs.changed }}; do
            for deployment in $(kubectl get deploy --namespace="$service" -o name); do
              kubectl rollout restart "$deployment" --namespace="$service"
              kubectl rollout status "$deployment" --namespace="$service" --timeout=5m
            done
            echo "::notice::Rolled $service for new config"
          done

      - name: Warn if restart skipped
        if: ${{ !inputs.restart && steps.apply.outputs.changed != '' }}
        run: echo "::warning::ConfigMap changed for ${{ steps.apply.outputs.changed }} but restart was disabled; pods keep the old values until they cycle."
