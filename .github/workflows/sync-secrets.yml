name: Sync Secrets from 1Password

on:
  workflow_dispatch:  # Manual trigger only
  workflow_call:      # Can be called from other workflows

env:
  AWS_REGION: us-east-1
  OP_VAULT: Astro
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  sync-secrets:
    name: Sync secrets to AWS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/prod-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync astro-server secrets to AWS Secrets Manager
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # Get all fields from 1Password item as JSON
          SECRET_JSON=$(op item get "astro-server-secrets" --vault "${{ env.OP_VAULT }}" --format json | \
            jq '[.fields[] | select(.label != null and .value != null) | {(.label): .value}] | add')

          # Print the keys that were obtained (not the values)
          KEYS=$(echo "$SECRET_JSON" | jq -r 'keys | join(", ")')
          echo "::notice::📋 Obtained secrets: $KEYS"

          aws secretsmanager put-secret-value \
            --secret-id prod/astro-server/app \
            --secret-string "$SECRET_JSON"

          echo "::notice::✅ astro-server secrets synced to AWS Secrets Manager"
