name: ChatOps Migration

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

env:
  BYTEBASE_URL: https://bytebase.astroids.ai/
  BYTEBASE_SERVICE_ACCOUNT: github-bot@service.bytebase.com
  BYTEBASE_SERVICE_ACCOUNT_SECRET: ${{ secrets.BYTEBASE_SERVICE_ACCOUNT_SECRET }}
  BYTEBASE_PROJECT: "projects/astro"
  FILE_PATTERN: "apps/astro-server/migrations/*.sql"

jobs:
  parse-command:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/migrate')
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.parse.outputs.environment }}
      valid-command: ${{ steps.parse.outputs.valid-command }}
      valid-envs: ${{ steps.parse.outputs.valid-envs }}
      stage: ${{ steps.parse.outputs.stage }}
      targets: ${{ steps.parse.outputs.targets }}
    steps:
      - name: Parse migrate command
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"

          # Extract environment from "/migrate <environment>"
          if [[ $COMMENT =~ ^/migrate[[:space:]]+([a-zA-Z-]+) ]]; then
            ENVIRONMENT="${BASH_REMATCH[1]}"
          else
            echo "valid-command=false" >> $GITHUB_OUTPUT
            echo "valid-envs=preview, prod" >> $GITHUB_OUTPUT
            exit 0
          fi

          case "$ENVIRONMENT" in
            preview)
              echo "environment=preview" >> $GITHUB_OUTPUT
              echo "stage=environments/preview" >> $GITHUB_OUTPUT
              echo "targets=instances/preview/databases/astro" >> $GITHUB_OUTPUT
              echo "valid-command=true" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "environment=prod" >> $GITHUB_OUTPUT
              echo "stage=environments/prod" >> $GITHUB_OUTPUT
              echo "targets=instances/prod-postgresql/databases/astro" >> $GITHUB_OUTPUT
              echo "valid-command=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "valid-command=false" >> $GITHUB_OUTPUT
              echo "valid-envs=preview, prod" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Add reaction to comment
        if: steps.parse.outputs.valid-command == 'true'
        uses: peter-evans/create-or-update-comment@v3
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: rocket

      - name: Comment on invalid command
        if: steps.parse.outputs.valid-command == 'false'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Invalid migrate command.

            **Usage:** `/migrate <environment>`
            **Valid environments:** `${{ steps.parse.outputs.valid-envs }}`

  deploy:
    needs: parse-command
    if: needs.parse-command.outputs.valid-command == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.parse-command.outputs.environment }}
    container:
      image: bytebase/bytebase-action:latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge

      - name: Comment deployment started
        id: deployment-comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            **Migration deployment starting**

            **Environment:** `${{ needs.parse-command.outputs.environment }}`
            **Triggered by:** @${{ github.event.comment.user.login }}

            [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Create rollout plan
        id: create-rollout
        env:
          BYTEBASE_TARGETS: ${{ needs.parse-command.outputs.targets }}
          BYTEBASE_OUTPUT: ${{ runner.temp }}/bytebase-metadata.json
        run: |
          bytebase-action rollout \
            --url=${{ env.BYTEBASE_URL }} \
            --project=${{ env.BYTEBASE_PROJECT }} \
            --file-pattern=${{ env.FILE_PATTERN }} \
            --targets=${{ env.BYTEBASE_TARGETS }} \
            --output=${{ env.BYTEBASE_OUTPUT }}

          PLAN=$(jq -r .plan ${{ env.BYTEBASE_OUTPUT }})
          echo "plan=$PLAN" >> $GITHUB_OUTPUT

      - name: Extract rollout metadata
        id: metadata
        run: |
          METADATA="${{ runner.temp }}/bytebase-metadata.json"
          BASE_URL="${{ env.BYTEBASE_URL }}"
          BASE_URL="${BASE_URL%/}"

          echo "release=$(jq -r .release "$METADATA")" >> $GITHUB_OUTPUT
          echo "plan=$(jq -r .plan "$METADATA")" >> $GITHUB_OUTPUT
          echo "rollout=$(jq -r .rollout "$METADATA")" >> $GITHUB_OUTPUT
          echo "base-url=$BASE_URL" >> $GITHUB_OUTPUT

      - name: Execute rollout
        run: |
          bytebase-action rollout \
            --url=${{ env.BYTEBASE_URL }} \
            --project=${{ env.BYTEBASE_PROJECT }} \
            --target-stage=${{ needs.parse-command.outputs.stage }} \
            --plan=${{ steps.create-rollout.outputs.plan }}

      - name: Comment success
        if: success()
        uses: peter-evans/create-or-update-comment@v3
        with:
          comment-id: ${{ steps.deployment-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            **Migration deployed to `${{ needs.parse-command.outputs.environment }}`**

            **Triggered by:** @${{ github.event.comment.user.login }}

            | Resource | Link |
            |----------|------|
            | Release | ${{ steps.metadata.outputs.base-url }}/${{ steps.metadata.outputs.release }} |
            | Plan | ${{ steps.metadata.outputs.base-url }}/${{ steps.metadata.outputs.plan }} |
            | Rollout | ${{ steps.metadata.outputs.base-url }}/${{ steps.metadata.outputs.rollout }} |

      - name: Comment failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v3
        with:
          comment-id: ${{ steps.deployment-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            **Migration deployment failed**

            **Environment:** `${{ needs.parse-command.outputs.environment }}`
            **Triggered by:** @${{ github.event.comment.user.login }}

            Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
