name: Deploy (Preview)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  # Changes: detect which services were modified
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: filter
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo 'services=["astro-server","astro-client","astro-registry"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only HEAD^ HEAD)
          services='[]'

          if echo "$changed" | grep -qE '^(apps/astro-server|deployment/Dockerfile\.astro-server|packages/astro-spec|sql)/'; then
            services=$(echo "$services" | jq -c '. + ["astro-server"]')
          fi
          if echo "$changed" | grep -qE '^(apps/astro-client|deployment/Dockerfile\.astro-client)/'; then
            services=$(echo "$services" | jq -c '. + ["astro-client"]')
          fi
          if echo "$changed" | grep -qE '^(apps/astro-registry|deployment/Dockerfile\.astro-registry)/'; then
            services=$(echo "$services" | jq -c '. + ["astro-registry"]')
          fi

          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "::notice::Changed services: $services"

  # ---------------------------------------------------------------------------
  # Validate: ensure required vars and secrets are set
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Check required variables
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          IAM_ROLE_SUFFIX: ${{ vars.IAM_ROLE_SUFFIX }}
          ECR_PREFIX: ${{ vars.ECR_PREFIX }}
          AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY }}
          EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
          ENV_NAME: ${{ vars.ENV_NAME }}
        run: |
          errors=()
          [ -z "$AWS_ACCOUNT_ID" ] && errors+=("secret: AWS_ACCOUNT_ID")
          [ -z "$IAM_ROLE_SUFFIX" ] && errors+=("var: IAM_ROLE_SUFFIX")
          [ -z "$ECR_PREFIX" ] && errors+=("var: ECR_PREFIX")
          [ -z "$AMPLITUDE_API_KEY" ] && errors+=("var: AMPLITUDE_API_KEY")
          [ -z "$EKS_CLUSTER" ] && errors+=("var: EKS_CLUSTER")
          [ -z "$ENV_NAME" ] && errors+=("var: ENV_NAME")
          if [ ${#errors[@]} -gt 0 ]; then
            echo "::error::Missing required variables: ${errors[*]}"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Migrate: apply schema changes directly to preview DB
  # ---------------------------------------------------------------------------
  migrate:
    needs: [changes, validate]
    if: contains(fromJson(needs.changes.outputs.services), 'astro-server')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      - name: Apply declarative schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          atlas schema apply \
            --url "$DATABASE_URL" \
            --to "file://sql/astro-server/schema.sql" \
            --dev-url "docker://postgres/17/dev" \
            --exclude "atlas_schema_revisions" --exclude "river" \
            --auto-approve

      - name: Apply River migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          atlas migrate apply \
            --url "$DATABASE_URL" \
            --dir "file://sql/river" \
            --revisions-schema atlas_schema_revisions \
            --allow-dirty

  # ---------------------------------------------------------------------------
  # Build: multi-arch images, push by digest to preview ECR
  # ---------------------------------------------------------------------------
  build:
    needs: [changes, validate]
    if: needs.changes.outputs.services != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: preview
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.IAM_ROLE_SUFFIX }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.${{ matrix.service }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_PREFIX }}-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ env.PLATFORM_PAIR }}-preview
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ env.PLATFORM_PAIR }}-preview
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VITE_AMPLITUDE_API_KEY=${{ vars.AMPLITUDE_API_KEY }}
            VITE_ASSETS_URL=https://assets.astropod.ai
            VITE_FRONTEND_URL=https://astropod.ai

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/${{ matrix.service }}
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.service }}/${digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Deploy to preview
  # ---------------------------------------------------------------------------
  deploy:
    needs: [changes, validate, migrate, build]
    if: |
      always() &&
      needs.changes.outputs.services != '[]' &&
      needs.build.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.IAM_ROLE_SUFFIX }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest and push
        working-directory: ${{ runner.temp }}/digests/${{ matrix.service }}
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_PREFIX }}-${{ matrix.service }}"
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          echo "::notice::ECR: $IMAGE:${{ github.sha }}"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy ConfigMap
        run: |
          CONFIG_FILE="config/${{ matrix.service }}/${{ vars.ENV_NAME }}.env"
          if [ -f "$CONFIG_FILE" ]; then
            kubectl create configmap ${{ matrix.service }}-config \
              --from-env-file="$CONFIG_FILE" \
              --namespace=${{ matrix.service }} \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "::notice::ConfigMap updated for ${{ matrix.service }}"
          else
            echo "::warning::No $CONFIG_FILE found, skipping ConfigMap"
          fi

  # ---------------------------------------------------------------------------
  # Smoke test: run against preview after a successful deploy
  # ---------------------------------------------------------------------------
  smoke-test:
    needs: [deploy]
    if: needs.deploy.result == 'success'
    uses: ./.github/workflows/smoke-test.yml
    with:
      astro_test_host: https://astropod.ai
      astro_env: preview
    secrets: inherit
