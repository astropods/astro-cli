name: Build Queen CLI

on:
  push:
    branches: [main]
    paths:
      - "apps/astro-queen/**"
      - "packages/astro-proto/**"
  pull_request:
    paths:
      - "apps/astro-queen/**"
      - "packages/astro-proto/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: darwin
            goarch: amd64
            runner: macos-13
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/astro-queen/go.mod
          cache-dependency-path: apps/astro-queen/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Build web frontend
        working-directory: apps/astro-queen/web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build queen binary
        working-directory: apps/astro-queen
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          go build -ldflags "\
            -X github.com/postman/astro/apps/astro-queen/cmd.buildNumber=${{ github.run_number }} \
            -X github.com/postman/astro/apps/astro-queen/cmd.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o queen-${{ matrix.goos }}-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: queen-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apps/astro-queen/queen-${{ matrix.goos }}-${{ matrix.goarch }}
