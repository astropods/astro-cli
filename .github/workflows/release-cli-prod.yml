name: Release CLI (Prod)

# Releases the prod CLI (ast) from the monorepo. Fetches the private astro-cli
# submodule (requires the CLI_DEPLOY_KEY read-only deploy key), builds and embeds
# astro-client's chat SPA, then publishes the binaries. Manual dispatch only.
on:
  workflow_dispatch:

concurrency:
  group: release-cli-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check required variables
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          IAM_ROLE_SUFFIX: ${{ vars.IAM_ROLE_SUFFIX }}
          WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
          AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          errors=()
          [ -z "$AWS_ACCOUNT_ID" ] && errors+=("secret: AWS_ACCOUNT_ID")
          [ -z "$IAM_ROLE_SUFFIX" ] && errors+=("var: IAM_ROLE_SUFFIX")
          [ -z "$WORKOS_CLIENT_ID" ] && errors+=("var: WORKOS_CLIENT_ID")
          [ -z "$AMPLITUDE_API_KEY" ] && errors+=("var: AMPLITUDE_API_KEY")
          [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ] && errors+=("var: CLOUDFRONT_DISTRIBUTION_ID")
          if [ ${#errors[@]} -gt 0 ]; then
            echo "::error::Missing required variables: ${errors[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CLI submodule
        env:
          CLI_DEPLOY_KEY: ${{ secrets.CLI_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLI_DEPLOY_KEY" > ~/.ssh/cli_deploy && chmod 600 ~/.ssh/cli_deploy
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/cli_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git submodule update --init modules/astro-cli

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: modules/astro-cli/go.mod
          cache-dependency-path: modules/astro-cli/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Build astro-client's chat SPA and copy it into the CLI embed dir so the
      # binaries below ship the latest chat UI (see modules/astro-cli/internal/chatui).
      # The embed task lives in astro-client (not the public CLI) so the CLI repo
      # never references astro-client.
      - name: Build and embed chat UI
        run: bun x moon run astro-client:embed-into-cli

      - name: Set build variables
        id: vars
        run: |
          echo "version=$(cat modules/astro-cli/VERSION)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "binary_name=ast" >> "$GITHUB_OUTPUT"
          echo "server_url=https://astropods.com" >> "$GITHUB_OUTPUT"
          echo "registry_url=https://registry.astropods.ai" >> "$GITHUB_OUTPUT"
          echo "download_url=https://download.astropods.ai/latest" >> "$GITHUB_OUTPUT"
          echo "s3_bucket=prod-astro-downloads" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.IAM_ROLE_SUFFIX }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check version not already released
        env:
          S3_BUCKET: ${{ steps.vars.outputs.s3_bucket }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          if aws s3api head-object \
              --bucket "$S3_BUCKET" \
              --key "${VERSION}/checksums.txt" \
              > /dev/null 2>&1; then
            echo "::error::Version ${VERSION} is already released to s3://${S3_BUCKET}. Bump the VERSION file before releasing."
            exit 1
          fi
          echo "::notice::Version ${VERSION} not yet released, proceeding."

      - name: Build CLI binaries
        working-directory: modules/astro-cli
        env:
          BINARY_NAME: ${{ steps.vars.outputs.binary_name }}
          VERSION: ${{ steps.vars.outputs.version }}
          COMMIT: ${{ steps.vars.outputs.commit }}
          SERVER_URL: ${{ steps.vars.outputs.server_url }}
          REGISTRY_URL: ${{ steps.vars.outputs.registry_url }}
          DOWNLOAD_URL: ${{ steps.vars.outputs.download_url }}
          WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
          AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY }}
        run: |
          mkdir -p bin
          LDFLAGS="-s -w \
            -X github.com/astropods/astro-cli/internal/buildinfo.BinaryName=${BINARY_NAME} \
            -X github.com/astropods/astro-cli/internal/buildinfo.Version=${VERSION} \
            -X github.com/astropods/astro-cli/internal/buildinfo.Commit=${COMMIT} \
            -X github.com/astropods/astro-cli/internal/buildinfo.WorkOSClientID=${WORKOS_CLIENT_ID} \
            -X github.com/astropods/astro-cli/internal/buildinfo.DefaultServerURL=${SERVER_URL} \
            -X github.com/astropods/astro-cli/internal/buildinfo.DefaultRegistryURL=${REGISTRY_URL} \
            -X github.com/astropods/astro-cli/internal/buildinfo.DownloadBaseURL=${DOWNLOAD_URL} \
            -X github.com/astropods/astro-cli/internal/buildinfo.AmplitudeAPIKey=${AMPLITUDE_API_KEY}"

          for OS in darwin linux; do
            for ARCH in amd64 arm64; do
              echo "Building ${BINARY_NAME}-${OS}-${ARCH}..."
              GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 go build \
                -ldflags="$LDFLAGS" \
                -o bin/${BINARY_NAME}-${OS}-${ARCH} .
            done
          done

          cp VERSION bin/VERSION
          cd bin && sha256sum \
            ${BINARY_NAME}-darwin-amd64 \
            ${BINARY_NAME}-darwin-arm64 \
            ${BINARY_NAME}-linux-amd64 \
            ${BINARY_NAME}-linux-arm64 > checksums.txt

          echo "::notice::Built ${BINARY_NAME} ${VERSION} (${COMMIT}) for all platforms"

      - name: Verify build flags
        working-directory: modules/astro-cli
        env:
          BINARY_NAME: ${{ steps.vars.outputs.binary_name }}
          VERSION: ${{ steps.vars.outputs.version }}
          COMMIT: ${{ steps.vars.outputs.commit }}
          SERVER_URL: ${{ steps.vars.outputs.server_url }}
          REGISTRY_URL: ${{ steps.vars.outputs.registry_url }}
          DOWNLOAD_URL: ${{ steps.vars.outputs.download_url }}
          WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
        run: |
          [ -n "$WORKOS_CLIENT_ID" ] || { echo "WORKOS_CLIENT_ID is not set"; exit 1; }

          BIN=bin/${BINARY_NAME}-linux-amd64
          FAIL=0

          check() {
            local label=$1 expected=$2
            if strings "$BIN" | grep -qF "$expected"; then
              echo "✓ $label: $expected"
            else
              echo "✗ $label not found: $expected"
              FAIL=1
            fi
          }

          check "version"         "$VERSION"
          check "commit"          "$COMMIT"
          check "binaryName"      "$BINARY_NAME"
          check "downloadBaseURL" "$DOWNLOAD_URL"
          check "serverURL"       "$SERVER_URL"
          check "registryURL"     "$REGISTRY_URL"
          check "workosClientID"  "$WORKOS_CLIENT_ID"

          [ $FAIL -eq 0 ] || { echo "One or more build flags missing from binary"; exit 1; }

      - name: Upload to S3
        env:
          S3_BUCKET: ${{ steps.vars.outputs.s3_bucket }}
          BINARY_NAME: ${{ steps.vars.outputs.binary_name }}
          VERSION: ${{ steps.vars.outputs.version }}
        working-directory: modules/astro-cli/bin
        run: |
          for OS in darwin linux; do
            for ARCH in amd64 arm64; do
              aws s3 cp ${BINARY_NAME}-${OS}-${ARCH} \
                s3://${S3_BUCKET}/${VERSION}/${BINARY_NAME}-${OS}-${ARCH} \
                --content-type application/octet-stream \
                --cache-control "public, max-age=31536000, immutable"
              echo "Uploaded ${VERSION}/${BINARY_NAME}-${OS}-${ARCH}"
            done
          done
          aws s3 cp checksums.txt s3://${S3_BUCKET}/${VERSION}/checksums.txt \
            --content-type text/plain \
            --cache-control "public, max-age=31536000, immutable"

          for OS in darwin linux; do
            for ARCH in amd64 arm64; do
              aws s3 cp \
                s3://${S3_BUCKET}/${VERSION}/${BINARY_NAME}-${OS}-${ARCH} \
                s3://${S3_BUCKET}/latest/${BINARY_NAME}-${OS}-${ARCH} \
                --content-type application/octet-stream \
                --cache-control "no-cache, no-store, must-revalidate"
            done
          done
          aws s3 cp s3://${S3_BUCKET}/${VERSION}/checksums.txt \
            s3://${S3_BUCKET}/latest/checksums.txt \
            --content-type text/plain \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp VERSION s3://${S3_BUCKET}/latest/VERSION \
            --content-type text/plain \
            --cache-control "no-cache, no-store, must-revalidate"

          echo "::notice::Released ${VERSION} to s3://${S3_BUCKET}"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/latest/*"
          echo "::notice::Invalidated CloudFront ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} /latest/*"
