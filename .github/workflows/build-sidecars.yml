name: Publish collector

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  # Validate: ensure required vars and secrets are set
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check required variables
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          errors=()
          [ -z "$AWS_ACCOUNT_ID" ] && errors+=("secret: AWS_ACCOUNT_ID")
          [ -z "$DOCKERHUB_USERNAME" ] && errors+=("secret: DOCKERHUB_USERNAME")
          [ -z "$DOCKERHUB_TOKEN" ] && errors+=("secret: DOCKERHUB_TOKEN")
          if [ ${#errors[@]} -gt 0 ]; then
            echo "::error::Missing required variables: ${errors[*]}"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Build: multi-arch images, push by digest to ECR + Docker Hub
  # ---------------------------------------------------------------------------
  build:
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/prod-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR by digest
        id: build-ecr
        uses: docker/build-push-action@v6
        with:
          context: packages/astro-collector
          file: deployment/Dockerfile.astro-collector
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.login-ecr.outputs.registry }}/prod-astro-collector,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=astro-collector-ecr-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=astro-collector-ecr-${{ env.PLATFORM_PAIR }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Build and push to Docker Hub by digest
        id: build-dockerhub
        uses: docker/build-push-action@v6
        with:
          context: packages/astro-collector
          file: deployment/Dockerfile.astro-collector
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=astropods/collector,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=astro-collector-dockerhub-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=astro-collector-dockerhub-${{ env.PLATFORM_PAIR }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Export ECR digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/ecr
          digest="${{ steps.build-ecr.outputs.digest }}"
          touch "${{ runner.temp }}/digests/ecr/${digest#sha256:}"

      - name: Export Docker Hub digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/dockerhub
          digest="${{ steps.build-dockerhub.outputs.digest }}"
          touch "${{ runner.temp }}/digests/dockerhub/${digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge: create multi-arch manifests and tag
  # ---------------------------------------------------------------------------
  merge:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/prod-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create ECR manifest and push
        working-directory: ${{ runner.temp }}/digests/ecr
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          PROD_IMAGE="$REGISTRY/prod-astro-collector"
          docker buildx imagetools create \
            -t "$PROD_IMAGE:${{ github.sha }}" \
            -t "$PROD_IMAGE:latest" \
            $(printf "$PROD_IMAGE@sha256:%s " *)
          echo "::notice::ECR: $PROD_IMAGE:${{ github.sha }}"

      - name: Copy to preview ECR
        run: |
          PROD_REPO="prod-astro-collector"
          PREVIEW_REPO="preview-astro-collector"
          TAG="${{ github.sha }}"
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$PROD_REPO" \
            --image-ids imageTag="$TAG" \
            --query 'images[0].imageManifest' \
            --output text)
          aws ecr put-image --repository-name "$PREVIEW_REPO" --image-tag "$TAG" --image-manifest "$MANIFEST" || true
          aws ecr put-image --repository-name "$PREVIEW_REPO" --image-tag "latest" --image-manifest "$MANIFEST" || true
          echo "::notice::ECR: preview-astro-collector:$TAG"

      - name: Create Docker Hub manifest and push
        working-directory: ${{ runner.temp }}/digests/dockerhub
        run: |
          IMAGE="astropods/collector"
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          echo "::notice::Docker Hub: $IMAGE:${{ github.sha }}"
