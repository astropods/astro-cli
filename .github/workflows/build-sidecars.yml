name: Build Sidecars

on:
  workflow_dispatch:
    inputs:
      astro-collector:
        description: "Build astro-collector"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  # Prepare: build matrix from selected sidecars
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
      merge_matrix: ${{ steps.set-matrix.outputs.merge_matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          build_items='[]'
          merge_items='[]'

          if [ "${{ inputs.astro-collector }}" == "true" ]; then
            build_items=$(echo "$build_items" | jq -c '. + [
              {"service":"astro-collector","platform":"linux/amd64","runner":"ubuntu-latest","push_ecr":true,"push_ghcr":true},
              {"service":"astro-collector","platform":"linux/arm64","runner":"ubuntu-24.04-arm","push_ecr":true,"push_ghcr":true}
            ]')
            merge_items=$(echo "$merge_items" | jq -c '. + [{"service":"astro-collector","push_ecr":true,"push_ghcr":true}]')
          fi

          count=$(echo "$build_items" | jq length)
          if [ "$count" -eq 0 ]; then
            echo "::error::No sidecars selected. Please select at least one."
            exit 1
          fi

          build_matrix=$(echo "$build_items" | jq -c '{"include":.}')
          merge_matrix=$(echo "$merge_items" | jq -c '{"include":.}')

          echo "build_matrix=$build_matrix" >> "$GITHUB_OUTPUT"
          echo "merge_matrix=$merge_matrix" >> "$GITHUB_OUTPUT"
          echo "::notice::Build matrix: $build_matrix"

  # ---------------------------------------------------------------------------
  # Validate: ensure required vars and secrets are set
  # ---------------------------------------------------------------------------
  validate:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Check required variables
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          errors=()
          [ -z "$AWS_ACCOUNT_ID" ] && errors+=("secret: AWS_ACCOUNT_ID")
          [ -z "$GHCR_PAT" ] && errors+=("secret: GHCR_PAT")
          if [ ${#errors[@]} -gt 0 ]; then
            echo "::error::Missing required variables: ${errors[*]}"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Build: multi-arch images, push by digest to GHCR + ECR
  # ---------------------------------------------------------------------------
  build:
    needs: [prepare, validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        if: matrix.push_ecr
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/prod-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: matrix.push_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GitHub Container Registry
        if: matrix.push_ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR by digest
        if: matrix.push_ecr
        id: build-ecr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.${{ matrix.service }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.login-ecr.outputs.registry }}/prod-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-ecr-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-ecr-${{ env.PLATFORM_PAIR }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Build and push to GHCR by digest
        if: matrix.push_ghcr
        id: build-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.${{ matrix.service }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/saswatds/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-ghcr-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-ghcr-${{ env.PLATFORM_PAIR }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Export ECR digest
        if: matrix.push_ecr
        run: |
          mkdir -p ${{ runner.temp }}/digests/ecr/${{ matrix.service }}
          digest="${{ steps.build-ecr.outputs.digest }}"
          touch "${{ runner.temp }}/digests/ecr/${{ matrix.service }}/${digest#sha256:}"

      - name: Export GHCR digest
        if: matrix.push_ghcr
        run: |
          mkdir -p ${{ runner.temp }}/digests/ghcr/${{ matrix.service }}
          digest="${{ steps.build-ghcr.outputs.digest }}"
          touch "${{ runner.temp }}/digests/ghcr/${{ matrix.service }}/${digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge: create multi-arch manifests and tag
  # ---------------------------------------------------------------------------
  merge:
    needs: [prepare, validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.merge_matrix) }}
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Configure AWS credentials
        if: matrix.push_ecr
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/prod-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: matrix.push_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GitHub Container Registry
        if: matrix.push_ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create ECR manifest and push
        if: matrix.push_ecr
        working-directory: ${{ runner.temp }}/digests/ecr/${{ matrix.service }}
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          PROD_IMAGE="$REGISTRY/prod-${{ matrix.service }}"
          docker buildx imagetools create \
            -t "$PROD_IMAGE:${{ github.sha }}" \
            -t "$PROD_IMAGE:latest" \
            $(printf "$PROD_IMAGE@sha256:%s " *)
          echo "::notice::ECR: $PROD_IMAGE:${{ github.sha }}"

      - name: Copy to preview ECR
        if: matrix.push_ecr
        run: |
          PROD_REPO="prod-${{ matrix.service }}"
          PREVIEW_REPO="preview-${{ matrix.service }}"
          TAG="${{ github.sha }}"
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$PROD_REPO" \
            --image-ids imageTag="$TAG" \
            --query 'images[0].imageManifest' \
            --output text)
          aws ecr put-image --repository-name "$PREVIEW_REPO" --image-tag "$TAG" --image-manifest "$MANIFEST" || true
          aws ecr put-image --repository-name "$PREVIEW_REPO" --image-tag "latest" --image-manifest "$MANIFEST" || true
          echo "::notice::ECR: preview-${{ matrix.service }}:$TAG"

      - name: Create GHCR manifest and push
        if: matrix.push_ghcr
        working-directory: ${{ runner.temp }}/digests/ghcr/${{ matrix.service }}
        run: |
          IMAGE="ghcr.io/saswatds/${{ matrix.service }}"
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          echo "::notice::GHCR: $IMAGE:${{ github.sha }}"
