name: Astro Client E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/astro-client/**"
      - ".github/workflows/astro-client-e2e.yml"
  push:
    branches: [main]
    paths:
      - "apps/astro-client/**"
      - ".github/workflows/astro-client-e2e.yml"

concurrency:
  group: astro-client-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Run astro-client Playwright suite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build workspace theme package
        working-directory: packages/astro-theme
        run: bun run build

      - name: Install Playwright browser dependencies
        working-directory: apps/astro-client
        run: bunx playwright install --with-deps chromium

      - name: Run client E2E tests
        working-directory: apps/astro-client
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/astro-client/playwright-report
            apps/astro-client/test-results
          if-no-files-found: ignore
