name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/astro-server/**"
      - "apps/astro-registry/**"
      - "packages/**"
      - "deployment/Dockerfile.astro-server"
      - "deployment/Dockerfile.astro-registry"
      - "config/**"

  workflow_dispatch:
    inputs:
      astro-server:
        description: "Build astro-server"
        type: boolean
        default: false
      astro-registry:
        description: "Build astro-registry"
        type: boolean
        default: false
      sync-secrets:
        description: "Sync secrets from 1Password first"
        type: boolean
        default: false
      environment:
        description: "Target environment"
        type: choice
        options:
          - preview
          - prod

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  # Prepare: determine which services to build
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          services='[]'

          if [ "${{ github.event_name }}" == "push" ]; then
            # On push to main, build both services
            services='["astro-server","astro-registry"]'
          else
            # On workflow_dispatch, build selected services
            if [ "${{ inputs.astro-server }}" == "true" ]; then
              services=$(echo "$services" | jq -c '. + ["astro-server"]')
            fi
            if [ "${{ inputs.astro-registry }}" == "true" ]; then
              services=$(echo "$services" | jq -c '. + ["astro-registry"]')
            fi
          fi

          count=$(echo "$services" | jq length)
          if [ "$count" -eq 0 ]; then
            echo "::error::No services selected. Please select at least one service to build."
            exit 1
          fi

          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "::notice::Services: $services"

  # ---------------------------------------------------------------------------
  # Build: multi-arch images, push by digest to preview ECR
  # ---------------------------------------------------------------------------
  build:
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: preview
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.IAM_ROLE_SUFFIX }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.${{ matrix.service }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_PREFIX }}-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ env.PLATFORM_PAIR }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GITHUB_PACKAGES_TOKEN=${{ matrix.service == 'astro-server' && secrets.GHCR_PAT || '' }}
            WORKOS_CLIENT_ID=${{ matrix.service == 'astro-server' && secrets.WORKOS_CLIENT_ID || '' }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/${{ matrix.service }}
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.service }}/${digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Deploy to preview: merge manifests, push tags, deploy ConfigMap
  # ---------------------------------------------------------------------------
  deploy-preview:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.IAM_ROLE_SUFFIX }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest and push
        working-directory: ${{ runner.temp }}/digests/${{ matrix.service }}
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_PREFIX }}-${{ matrix.service }}"
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          echo "::notice::ECR: $IMAGE:${{ github.sha }}"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy ConfigMap
        run: |
          CONFIG_FILE="config/${{ matrix.service }}/${{ vars.ENV_NAME }}.env"
          if [ -f "$CONFIG_FILE" ]; then
            kubectl create configmap ${{ matrix.service }}-config \
              --from-env-file="$CONFIG_FILE" \
              --namespace=${{ matrix.service }} \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "::notice::ConfigMap updated for ${{ matrix.service }}"
          else
            echo "::warning::No $CONFIG_FILE found, skipping ConfigMap"
          fi

  # ---------------------------------------------------------------------------
  # Sync secrets (optional, only on workflow_dispatch)
  # ---------------------------------------------------------------------------
  sync-secrets:
    if: inputs.sync-secrets == true
    needs: [deploy-preview]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.IAM_ROLE_SUFFIX }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync astro-server secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_VAULT: Astro
        run: |
          SECRET_JSON=$(op item get "${{ vars.OP_ITEM_NAME }}" --vault "$OP_VAULT" --format json | \
            jq '[.fields[] | select(.label != null and .value != null and (.label | test("^[A-Z0-9_]+$"))) | {(.label): .value}] | add')
          KEYS=$(echo "$SECRET_JSON" | jq -r 'keys | join(", ")')
          echo "::notice::Syncing secrets: $KEYS"
          aws secretsmanager put-secret-value \
            --secret-id ${{ vars.SECRETS_MANAGER_PREFIX }}/astro-server/app \
            --secret-string "$SECRET_JSON"
          echo "::notice::astro-server secrets synced"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Force ExternalSecret resync
        run: |
          kubectl annotate externalsecret astro-server-secrets -n astro-server "force-sync=$(date +%s)" --overwrite
          echo "::notice::Triggered ExternalSecret resync"

  # ---------------------------------------------------------------------------
  # Deploy to prod: copy images from preview ECR, deploy ConfigMap
  # ---------------------------------------------------------------------------
  deploy-prod:
    if: github.event_name == 'push' || inputs.environment == 'prod'
    needs: [prepare, deploy-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (preview — source)
        uses: aws-actions/configure-aws-credentials@v4
        id: preview-creds
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/preview-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to preview ECR
        id: login-preview-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Copy image from preview to prod ECR
        run: |
          PREVIEW_IMAGE="${{ steps.login-preview-ecr.outputs.registry }}/preview-${{ matrix.service }}:${{ github.sha }}"
          PROD_IMAGE="${{ steps.login-preview-ecr.outputs.registry }}/prod-${{ matrix.service }}:${{ github.sha }}"
          PROD_IMAGE_LATEST="${{ steps.login-preview-ecr.outputs.registry }}/prod-${{ matrix.service }}:latest"

          crane copy "$PREVIEW_IMAGE" "$PROD_IMAGE"
          crane copy "$PREVIEW_IMAGE" "$PROD_IMAGE_LATEST"
          echo "::notice::Copied $PREVIEW_IMAGE -> prod-${{ matrix.service }}:${{ github.sha }} + latest"

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/prod-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name prod-primary-eks --region ${{ env.AWS_REGION }}

      - name: Deploy ConfigMap
        run: |
          CONFIG_FILE="config/${{ matrix.service }}/prod.env"
          if [ -f "$CONFIG_FILE" ]; then
            kubectl create configmap ${{ matrix.service }}-config \
              --from-env-file="$CONFIG_FILE" \
              --namespace=${{ matrix.service }} \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "::notice::ConfigMap updated for ${{ matrix.service }}"
          else
            echo "::warning::No $CONFIG_FILE found, skipping ConfigMap"
          fi
