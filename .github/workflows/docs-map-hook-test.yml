name: Docs Map Hook Test

on:
  pull_request:
    paths:
      - '.claude/hooks/**'
  push:
    branches:
      - main
    paths:
      - '.claude/hooks/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .claude/hooks/docs-map-check.test.mjs
