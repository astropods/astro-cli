name: Prompt Eval

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/astro-cli/cmd/coding_prompt.go'
      - 'apps/astro-cli/cmd/prompt_eval_test.go'

jobs:
  eval-prompt:
    runs-on: ubuntu-latest
    name: Grade coding-agent prompt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/astro-cli/go.sum

      - name: Install dependencies
        working-directory: apps/astro-cli
        run: go mod download

      - name: Run prompt eval
        working-directory: apps/astro-cli
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: go test ./cmd/ -tags eval -run TestEval_Graded -v -timeout 120s
