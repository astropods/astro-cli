name: PR Changelog

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  update-pr-description:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Find changelog and update PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const branch = context.payload.pull_request.head.ref;
            const changelogDir = 'docs/changelog';

            const commentMarker = '<!-- pr-changelog-bot -->';

            // Match exactly {branch}-YYYY-MM-DD.md to avoid false positives
            // from similarly-prefixed branches (e.g. "spec-update" vs "spec-update-v2").
            // Reads recursively so branch names with slashes (e.g. "fix/foo") map to subdirectories.
            const pattern = new RegExp(`^${branch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}-\\d{4}-\\d{2}-\\d{2}\\.md$`);
            const walk = (dir) => {
              if (!fs.existsSync(dir)) return [];
              let results = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const rel = path.relative(changelogDir, path.join(dir, entry.name));
                if (entry.isDirectory()) results.push(...walk(path.join(dir, entry.name)));
                else if (pattern.test(rel)) results.push(rel);
              }
              return results;
            };
            const files = walk(changelogDir).sort().reverse();

            // Find any existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const botComment = comments.find(c => c.body.includes(commentMarker));

            if (files.length === 0) {
              const today = new Date().toISOString().slice(0, 10);
              const warning = [
                commentMarker,
                `> **No changelog found for branch \`${branch}\`**`,
                '>',
                '> Add a changelog file so the PR description is updated automatically:',
                '>',
                '> ```',
                `> docs/changelog/${branch}-${today}.md`,
                '> ```',
                '>',
                '> For branches with slashes (e.g. `fix/my-change`), create subdirectories to match.',
                '>',
                '> This file should describe what changed and why. See existing files in `docs/changelog/` for examples.',
              ].join('\n');

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: botComment.id, body: warning,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number, body: warning,
                });
              }
              console.log('No changelog found — posted warning comment.');
              return;
            }

            // Remove warning comment if changelog now exists
            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }

            if (files.length > 1) {
              core.warning(
                `Multiple changelogs found for branch "${branch}": ${files.join(', ')}. Using latest: ${files[0]}`
              );
            }

            const content = fs.readFileSync(path.join(changelogDir, files[0]), 'utf8');

            // Soft warning, same as the missing-file case above -- doesn't block.
            const shapeMarker = '<!-- pr-changelog-shape-bot -->';
            const requiredSections = ['## Summary', '## Design', '## Migration'];
            const missingSections = requiredSections.filter(s => !content.includes(s));
            const shapeComment = comments.find(c => c.body.includes(shapeMarker));

            if (missingSections.length > 0) {
              const warning = [
                shapeMarker,
                `> **${files[0]} is missing: ${missingSections.join(', ')}**`,
                '>',
                '> Changelogs need all three sections (Summary, Design, Migration) per `agents.md`\'s Changelogs rule, even if Migration is just "None."',
              ].join('\n');

              if (shapeComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: shapeComment.id, body: warning,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number, body: warning,
                });
              }
              console.log(`Changelog missing sections: ${missingSections.join(', ')} — posted warning comment.`);
            } else if (shapeComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: shapeComment.id,
              });
            }

            const current = context.payload.pull_request.body || '';

            const marker = '<!-- changelog-start -->';
            const endMarker = '<!-- changelog-end -->';
            const section = `${marker}\n${content}\n${endMarker}`;

            let body;
            if (current.includes(marker)) {
              body = current.replace(
                new RegExp(`${marker}[\\s\\S]*?${endMarker}`),
                section
              );
            } else {
              body = current ? `${current}\n\n${section}` : section;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: body,
            });

            console.log(`Updated PR #${context.payload.pull_request.number} with changelog from ${files[0]}`);
