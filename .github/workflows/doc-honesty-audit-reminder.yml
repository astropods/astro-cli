name: Doc Honesty Audit Reminder

# Posts a quarterly Slack reminder to run the doc honesty audit (see
# docs/04-guides/doc-honesty-audit.md). This posts a reminder only; it
# doesn't run the audit itself, since that needs a person or Claude Code
# session dispatching subagents with judgment, not something a script can
# do on its own.
#
# Schedule note: GitHub cron is UTC-only. Fires 14:00 UTC on the 1st of
# Jan/Apr/Jul/Oct, aligned to calendar quarters.
on:
  schedule:
    - cron: "0 14 1 1,4,7,10 *"
  workflow_dispatch: {} # allow manual runs for testing

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Post reminder to Slack
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_ASTRO_OPS_CHANNEL_ID }}
        with:
          script: |
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const text = [
              ":mag: *Doc honesty audit due*",
              "Quarterly reminder to run the adversarial doc audit, not just the automated freshness check.",
              `See <${repoUrl}/blob/main/docs/04-guides/doc-honesty-audit.md|docs/04-guides/doc-honesty-audit.md> for the process.`,
            ].join("\n");

            const token = process.env.SLACK_BOT_TOKEN;
            const channel = process.env.SLACK_CHANNEL_ID;
            if (!token || !channel) {
              core.setFailed("Missing SLACK_BOT_TOKEN secret or SLACK_ASTRO_OPS_CHANNEL_ID variable.");
              return;
            }

            const res = await fetch("https://slack.com/api/chat.postMessage", {
              method: "POST",
              headers: {
                "Content-Type": "application/json; charset=utf-8",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({
                channel,
                text,
                unfurl_links: false,
                unfurl_media: false,
              }),
            });

            const data = await res.json();
            if (!data.ok) {
              core.setFailed(`Slack chat.postMessage failed: ${data.error}`);
            } else {
              core.info(`Posted doc honesty audit reminder to Slack channel ${channel}.`);
            }
