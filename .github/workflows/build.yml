name: Build and Push Images

on:
  workflow_dispatch:
    inputs:
      sync-secrets:
        description: 'Sync secrets from 1Password first'
        type: boolean
        default: false
      astro-server:
        description: 'Build astro-server'
        type: boolean
        default: false
      astro-registry:
        description: 'Build astro-registry'
        type: boolean
        default: false
      astro-messaging:
        description: 'Build astro-messaging'
        type: boolean
        default: false
      astro-playground:
        description: 'Build astro-playground'
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  EKS_CLUSTER: prod-primary-eks

jobs:
  # Optional: Sync secrets if requested
  sync-secrets:
    name: Sync secrets
    if: github.event.inputs.sync-secrets == 'true'
    uses: ./.github/workflows/sync-secrets.yml
    secrets: inherit

  prepare:
    needs: [sync-secrets]
    if: always() && (needs.sync-secrets.result == 'success' || needs.sync-secrets.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          services=()
          [ "${{ inputs.astro-server }}" == "true" ] && services+=("astro-server")
          [ "${{ inputs.astro-registry }}" == "true" ] && services+=("astro-registry")
          [ "${{ inputs.astro-messaging }}" == "true" ] && services+=("astro-messaging")
          [ "${{ inputs.astro-playground }}" == "true" ] && services+=("astro-playground")

          if [ ${#services[@]} -eq 0 ]; then
            echo "::error::No services selected. Please select at least one service to build."
            exit 1
          fi

          json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -sc .)
          echo "matrix=$json" >> $GITHUB_OUTPUT

  build-and-push:
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.matrix) }}

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build context
        id: config
        run: |
          echo "dockerfile=deployment/Dockerfile.${{ matrix.service }}" >> $GITHUB_OUTPUT
          echo "context=." >> $GITHUB_OUTPUT

          # Determine which registries to push to
          # astro-messaging: both ECR and GHCR
          # astro-playground: GHCR only
          # astro-server, astro-registry: ECR only
          if [[ "${{ matrix.service }}" == "astro-messaging" ]]; then
            echo "push_ghcr=true" >> $GITHUB_OUTPUT
            echo "push_ecr=true" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.service }}" == "astro-playground" ]]; then
            echo "push_ghcr=true" >> $GITHUB_OUTPUT
            echo "push_ecr=false" >> $GITHUB_OUTPUT
          else
            echo "push_ghcr=false" >> $GITHUB_OUTPUT
            echo "push_ecr=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.config.outputs.push_ecr == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/prod-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: steps.config.outputs.push_ecr == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GitHub Container Registry
        if: steps.config.outputs.push_ghcr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: saswatds
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR (multi-platform)
        if: steps.config.outputs.push_ecr == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/prod-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/prod-${{ matrix.service }}:latest
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Build and push to GHCR (multi-platform)
        if: steps.config.outputs.push_ghcr == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/saswatds/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/saswatds/${{ matrix.service }}:latest
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Output image URIs (ECR)
        if: steps.config.outputs.push_ecr == 'true'
        run: |
          echo "::notice::✅ ECR: ${{ steps.login-ecr.outputs.registry }}/prod-${{ matrix.service }}:${{ github.sha }}"

      - name: Output image URIs (GHCR)
        if: steps.config.outputs.push_ghcr == 'true'
        run: |
          echo "::notice::✅ GHCR: ghcr.io/saswatds/${{ matrix.service }}:${{ github.sha }}"

      - name: Update kubeconfig
        if: steps.config.outputs.push_ecr == 'true'
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy ConfigMap
        if: steps.config.outputs.push_ecr == 'true'
        run: |
          # Determine config file path based on service
          CONFIG_FILE="config/${{ matrix.service }}/prod.env"

          if [ -f "$CONFIG_FILE" ]; then
            kubectl create configmap ${{ matrix.service }}-config \
              --from-env-file="$CONFIG_FILE" \
              --namespace=${{ matrix.service }} \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "::notice::✅ ConfigMap updated for ${{ matrix.service }}"
          else
            echo "::warning::No $CONFIG_FILE found, skipping ConfigMap for ${{ matrix.service }}"
          fi
