name: Build and Push to ECR

on:
  workflow_dispatch:
    inputs:
      sync-secrets:
        description: 'Sync secrets from 1Password first'
        type: boolean
        default: false
      astro-server:
        description: 'Build astro-server'
        type: boolean
        default: false
      astro-registry:
        description: 'Build astro-registry'
        type: boolean
        default: false
      astro-messaging:
        description: 'Build astro-messaging'
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  EKS_CLUSTER: prod-primary-eks

jobs:
  # Optional: Sync secrets if requested
  sync-secrets:
    name: Sync secrets
    if: github.event.inputs.sync-secrets == 'true'
    uses: ./.github/workflows/sync-secrets.yml
    secrets: inherit

  prepare:
    needs: [sync-secrets]
    if: always() && (needs.sync-secrets.result == 'success' || needs.sync-secrets.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          services=()
          [ "${{ inputs.astro-server }}" == "true" ] && services+=("astro-server")
          [ "${{ inputs.astro-registry }}" == "true" ] && services+=("astro-registry")
          [ "${{ inputs.astro-messaging }}" == "true" ] && services+=("astro-messaging")

          if [ ${#services[@]} -eq 0 ]; then
            echo "::error::No services selected. Please select at least one service to build."
            exit 1
          fi

          json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -sc .)
          echo "matrix=$json" >> $GITHUB_OUTPUT

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.matrix) }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build context
        id: config
        run: |
          echo "dockerfile=deployment/Dockerfile.${{ matrix.service }}" >> $GITHUB_OUTPUT
          echo "context=." >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/prod-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: prod-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f ${{ steps.config.outputs.dockerfile }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ${{ steps.config.outputs.context }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Output image URI
        run: |
          echo "::notice::✅ Image pushed: ${{ steps.login-ecr.outputs.registry }}/prod-${{ matrix.service }}:${{ github.sha }}"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy ConfigMap
        run: |
          # Determine config file path based on service
          CONFIG_FILE="config/${{ matrix.service }}/prod.env"

          if [ -f "$CONFIG_FILE" ]; then
            kubectl create configmap ${{ matrix.service }}-config \
              --from-env-file="$CONFIG_FILE" \
              --namespace=${{ matrix.service }} \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "::notice::✅ ConfigMap updated for ${{ matrix.service }}"
          else
            echo "::warning::No $CONFIG_FILE found, skipping ConfigMap for ${{ matrix.service }}"
          fi
