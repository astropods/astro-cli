name: SQL Review

on:
  pull_request:
    paths:
      - "sql/astro-server/schema.sql"
      - "sql/river/**"

env:
  BYTEBASE_URL: https://bytebase.astroids.ai/
  BYTEBASE_SERVICE_ACCOUNT: github-bot@service.bytebase.com
  BYTEBASE_SERVICE_ACCOUNT_SECRET: ${{ secrets.BYTEBASE_SERVICE_ACCOUNT_SECRET }}
  BYTEBASE_PROJECT: "projects/astro"

jobs:
  sql-review:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    container:
      image: docker://bytebase/bytebase-action:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review declarative schema
        id: review-schema
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYTEBASE_TARGETS: "instances/prod-postgresql/databases/astro"
        run: |
          OUTPUT=$(bytebase-action check \
            --url=${{ env.BYTEBASE_URL }} \
            --project=${{ env.BYTEBASE_PROJECT }} \
            --targets=${{ env.BYTEBASE_TARGETS }} \
            --file-pattern="sql/astro-server/schema.sql" \
            --declarative 2>&1) || true
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Review River migrations
        id: review-river
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYTEBASE_TARGETS: "instances/prod-postgresql/databases/astro"
        run: |
          OUTPUT=$(bytebase-action check \
            --url=${{ env.BYTEBASE_URL }} \
            --project=${{ env.BYTEBASE_PROJECT }} \
            --targets=${{ env.BYTEBASE_TARGETS }} \
            --file-pattern="sql/river/*.sql" 2>&1) || true
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const marker = '<!-- bytebase-sql-review -->';
            const schemaOutput = `${{ steps.review-schema.outputs.output }}`;
            const riverOutput = `${{ steps.review-river.outputs.output }}`;

            const body = [
              marker,
              '## Bytebase SQL Review',
              '',
              '### Declarative Schema',
              '',
              '```',
              schemaOutput || 'No issues found.',
              '```',
              '',
              '### River Migrations',
              '',
              '```',
              riverOutput || 'No issues found.',
              '```',
              '',
              `<sub>Reviewed by Bytebase \u00b7 ${new Date().toISOString().slice(0, 10)}</sub>`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  schema-plan:
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      - name: Generate declarative schema plan
        id: plan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          OUTPUT=$(atlas schema diff \
            --from "$DATABASE_URL" \
            --to "file://sql/astro-server/schema.sql" \
            --dev-url "$DEV_DATABASE_URL" \
            --exclude "atlas_schema_revisions,river" 2>&1)
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "has_changes=error" >> "$GITHUB_OUTPUT"
          elif [ -z "$OUTPUT" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "diff<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check pending River migrations
        id: river
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          OUTPUT=$(atlas migrate status \
            --url "$DATABASE_URL" \
            --dir "file://sql/river" \
            --revisions-schema atlas_schema_revisions 2>&1)
          STATUS=$?
          PENDING=$(echo "$OUTPUT" | grep -c "^  --" || true)
          if [ $STATUS -ne 0 ]; then
            echo "status=error" >> "$GITHUB_OUTPUT"
          elif [ "$PENDING" -gt 0 ]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
          else
            echo "status=current" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- atlas-schema-plan -->';
            const hasChanges = '${{ steps.plan.outputs.has_changes }}';
            const diff = `${{ steps.plan.outputs.diff }}`;
            const riverStatus = '${{ steps.river.outputs.status }}';
            const riverOutput = `${{ steps.river.outputs.output }}`;

            // --- Declarative schema section ---
            const sections = [];

            if (hasChanges === 'error') {
              sections.push(
                '### Declarative Schema',
                '',
                '> [!CAUTION]',
                '> Atlas failed to generate a migration plan.',
                '',
                '<details>',
                '<summary>Error output</summary>',
                '',
                '```',
                diff,
                '```',
                '',
                '</details>',
              );
            } else if (hasChanges === 'false') {
              sections.push(
                '### Declarative Schema',
                '',
                '> [!NOTE]',
                '> No schema changes detected. The preview database already matches `schema.sql`.',
              );
            } else {
              const lines = diff.split('\n');
              const adds = lines.filter(l => l.startsWith('+')).length;
              const drops = lines.filter(l => l.startsWith('-')).length;
              const alters = lines.filter(l => /^(ALTER|MODIFY)/i.test(l.trim())).length;

              const stats = [
                adds > 0 ? `**${adds}** addition${adds > 1 ? 's' : ''}` : '',
                drops > 0 ? `**${drops}** removal${drops > 1 ? 's' : ''}` : '',
                alters > 0 ? `**${alters}** alteration${alters > 1 ? 's' : ''}` : '',
              ].filter(Boolean).join(', ');

              sections.push(
                '### Declarative Schema',
                '',
                '> [!IMPORTANT]',
                '> The following SQL will be applied to the **preview** database on merge.',
                '',
                stats ? `${stats}\n` : '',
                '```sql',
                diff,
                '```',
              );
            }

            // --- River versioned migrations section ---
            sections.push('', '### River Migrations', '');

            if (riverStatus === 'error') {
              sections.push(
                '> [!CAUTION]',
                '> Failed to check River migration status.',
                '',
                '<details>',
                '<summary>Error output</summary>',
                '',
                '```',
                riverOutput,
                '```',
                '',
                '</details>',
              );
            } else if (riverStatus === 'pending') {
              sections.push(
                '> [!IMPORTANT]',
                '> Pending River migrations will be applied on merge.',
                '',
                '```',
                riverOutput,
                '```',
              );
            } else {
              sections.push(
                '> [!NOTE]',
                '> All River migrations are up to date.',
              );
            }

            const body = [
              marker,
              '## Migration Plan — Preview',
              '',
              ...sections,
              '',
              `<sub>Generated by Atlas \u00b7 ${new Date().toISOString().slice(0, 10)}</sub>`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
