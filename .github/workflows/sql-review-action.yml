name: SQL Review

on:
  pull_request:
    paths:
      - "sql/astro-server/schema.sql"
      - "sql/river/**"

env:
  BYTEBASE_URL: https://bytebase.astroids.ai/
  BYTEBASE_SERVICE_ACCOUNT: github-bot@service.bytebase.com
  BYTEBASE_SERVICE_ACCOUNT_SECRET: ${{ secrets.BYTEBASE_SERVICE_ACCOUNT_SECRET }}
  BYTEBASE_PROJECT: "projects/astro"

jobs:
  sql-review:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    container:
      image: docker://bytebase/bytebase-action:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Review against test and prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYTEBASE_TARGETS: "instances/prod-postgresql/databases/astro"
          FILE_PATTERN: "sql/astro-server/schema.sql"
        run: |
          bytebase-action check --url=${{ env.BYTEBASE_URL }} --project=${{ env.BYTEBASE_PROJECT }} --targets=${{ env.BYTEBASE_TARGETS }} --file-pattern=${{ env.FILE_PATTERN }} --declarative

  sql-review-river:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    container:
      image: docker://bytebase/bytebase-action:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Review River migrations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYTEBASE_TARGETS: "instances/prod-postgresql/databases/astro"
          FILE_PATTERN: "sql/river/*.sql"
        run: |
          bytebase-action check --url=${{ env.BYTEBASE_URL }} --project=${{ env.BYTEBASE_PROJECT }} --targets=${{ env.BYTEBASE_TARGETS }} --file-pattern=${{ env.FILE_PATTERN }}

  schema-plan:
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh

      - name: Generate migration plan
        id: plan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          OUTPUT=$(atlas schema diff \
            --from "$DATABASE_URL" \
            --to "file://sql/astro-server/schema.sql" \
            --dev-url "$DEV_DATABASE_URL" \
            --exclude "atlas_schema_revisions,river" 2>&1)
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "has_changes=error" >> "$GITHUB_OUTPUT"
          elif [ -z "$OUTPUT" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "diff<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- atlas-schema-plan -->';
            const hasChanges = '${{ steps.plan.outputs.has_changes }}';
            const diff = `${{ steps.plan.outputs.diff }}`;

            let body;
            if (hasChanges === 'error') {
              body = [
                marker,
                '## Schema Plan — Preview',
                '',
                '> [!CAUTION]',
                '> Atlas failed to generate a migration plan.',
                '',
                '<details>',
                '<summary>Error output</summary>',
                '',
                '```',
                diff,
                '```',
                '',
                '</details>',
              ].join('\n');
            } else if (hasChanges === 'false') {
              body = [
                marker,
                '## Schema Plan — Preview',
                '',
                '> [!NOTE]',
                '> No schema changes detected. The preview database already matches `schema.sql`.',
              ].join('\n');
            } else {
              const lines = diff.split('\n');
              const adds = lines.filter(l => l.startsWith('+')).length;
              const drops = lines.filter(l => l.startsWith('-')).length;
              const alters = lines.filter(l => /^(ALTER|MODIFY)/i.test(l.trim())).length;

              const stats = [
                adds > 0 ? `**${adds}** addition${adds > 1 ? 's' : ''}` : '',
                drops > 0 ? `**${drops}** removal${drops > 1 ? 's' : ''}` : '',
                alters > 0 ? `**${alters}** alteration${alters > 1 ? 's' : ''}` : '',
              ].filter(Boolean).join(', ');

              body = [
                marker,
                '## Schema Plan — Preview',
                '',
                '> [!IMPORTANT]',
                '> The following SQL will be applied to the **preview** database on merge.',
                '',
                stats ? `${stats}\n` : '',
                '```sql',
                diff,
                '```',
                '',
                `<sub>Generated by Atlas \u00b7 ${new Date().toISOString().slice(0, 10)}</sub>`,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
