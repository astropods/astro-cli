name: Bump CLI version on chat change

# The astro CLI embeds astro-client's chat UI. When the chat source changes on
# main, open a PR that bumps apps/astro-cli/VERSION (patch) so a prod CLI release
# (Release CLI (Prod), which refuses to re-release an existing version) can ship
# the updated chat. Preview releases pick up chat changes automatically via the
# Release CLI (Preview) path globs; this only handles the prod version bump.
#
# A PR is opened rather than pushing to main directly, per repo git policy.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/astro-client/src/pages/chat/**'
      - 'apps/astro-client/src/components/chat/**'
      - 'apps/astro-client/src/components/assistant-ui/**'
      - 'apps/astro-client/src/hooks/use-deployment-chat.ts'
      - 'apps/astro-client/src/hooks/use-chat-sessions.ts'
      - 'apps/astro-client/src/api/queries/chat.ts'
      - 'apps/astro-client/src/lib/chat/**'
      - 'apps/astro-client/src/lib/messaging/**'
      - 'apps/astro-client/src/chat-embed/**'
      - 'apps/astro-client/chat-embed.html'
      - 'apps/astro-client/vite.chat-embed.config.ts'
  workflow_dispatch:

concurrency:
  group: bump-cli-on-chat-change
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open VERSION bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Skip if this push already bumped VERSION (e.g. a human bumped it in
          # the same change) so we don't double-bump.
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
                | grep -qx 'apps/astro-cli/VERSION'; then
              echo "::notice::VERSION already changed in this push; skipping auto-bump."
              exit 0
            fi
          fi

          cur="$(cat apps/astro-cli/VERSION)"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$cur"
          new="${MAJOR}.${MINOR}.$((PATCH + 1))"
          branch="chore/bump-cli-${new}"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::notice::Branch $branch already exists; skipping."
            exit 0
          fi

          echo "$new" > apps/astro-cli/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/astro-cli/VERSION
          git commit -m "chore(cli): bump VERSION to ${new} for chat UI change"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(cli): bump VERSION to ${new}" \
            --body "$(cat <<'EOF'
          Automated bump of `apps/astro-cli/VERSION` because the embedded chat UI
          (astro-client chat) changed on main.

          The CLI embeds astro-client's chat at build time, so a prod CLI release
          must use a new version for `ast upgrade` to pick up the change. Merge,
          then run **Release CLI (Prod)**.
          EOF
          )"
