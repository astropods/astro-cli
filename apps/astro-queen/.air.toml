# Air - Live reload for Go apps
# Install: go install github.com/air-verse/air@latest

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/queen ."
  full_bin = "./tmp/queen local admin --no-open"
  delay = 1000
  exclude_dir = ["tmp", "web", "bin", "vendor"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "mod", "sum"]
  include_file = []
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = true
  time = false

[misc]
  clean_on_exit = true
