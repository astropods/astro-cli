layer: "application"
language: "go"

tasks:
  web-install:
    command: "cd web && bun install"
    inputs:
      - "web/package.json"
    outputs:
      - "web/node_modules"

  web-build:
    command: "cd web && bun run build"
    deps:
      - "web-install"
    inputs:
      - "web/src/**"
      - "web/index.html"
      - "web/vite.config.ts"
      - "web/tsconfig.json"
      - "web/package.json"
      - "web/bun.lock"
      - "web/components.json"
    outputs:
      - "web/dist/**"

  build:
    command: "go build -o bin/queen ."
    deps:
      - "web-build"
    inputs:
      - "**/*.go"
      - "web_embed.go"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-proto/**"
      - "web/dist/**"
    outputs:
      - "bin/queen"

  start:
    command: "./bin/queen server"
    deps:
      - "build"
    local: true

  dev:
    command: "./dev.sh"
    local: true

  link:
    # Always rebuild web + binary before symlinking. go:embed reads web/dist at
    # compile time; a cached build task can otherwise serve a stale embedded SPA.
    script: |
      set -euo pipefail
      cd web && bun run build
      cd .. && go build -o bin/queen .
      ln -sf "$(pwd)/bin/queen" "$HOME/go/bin/queen"
    deps:
      - "web-install"
    local: true
    options:
      cache: false

  unlink:
    command: "rm -f $HOME/go/bin/queen"

  fmt:
    command: "go fmt ./..."
    inputs:
      - "**/*.go"

  vet:
    command: "go vet ./..."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  deps:
    script: "go mod download && go mod tidy"
    inputs:
      - "go.mod"
    outputs:
      - "go.sum"
