layer: "application"
language: "go"

tasks:
  build:
    command: "go build -o bin/astro-queen ."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-proto/**"
    outputs:
      - "bin/astro-queen"

  # Run the TUI — connects to local astro-server by default.
  # Override server address: ASTRO_QUEEN_SERVER=host:9091 moon run astro-queen:run
  run:
    command: "sh -c './bin/astro-queen --server ${ASTRO_QUEEN_SERVER:-localhost:9091}'"
    deps:
      - "build"
    env:
      ASTRO_QUEEN_SERVER: "${ASTRO_QUEEN_SERVER:-localhost:9091}"
    options:
      persistent: true
      cache: false

  # Run with mTLS using certs generated by astro-server:gen-admin-certs.
  run-tls:
    command: >
      sh -c './bin/astro-queen
        --server ${ASTRO_QUEEN_SERVER:-localhost:9091}
        --config ${ASTRO_QUEEN_CONFIG:-~/.astro-queen/config.yaml}'
    deps:
      - "build"
    options:
      persistent: true
      cache: false

  link:
    command: "ln -sf $(pwd)/bin/astro-queen $HOME/go/bin/astro-queen"
    deps:
      - "build"

  fmt:
    command: "go fmt ./..."
    inputs:
      - "**/*.go"

  vet:
    command: "go vet ./..."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  deps:
    script: "go mod download && go mod tidy"
    inputs:
      - "go.mod"
    outputs:
      - "go.sum"
