layer: "application"
language: "go"

tasks:
  build:
    command: "go build -o bin/queen ."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-proto/**"
    outputs:
      - "bin/queen"

  link:
    command: "ln -sf $(pwd)/bin/queen $HOME/go/bin/queen"
    deps:
      - "build"

  unlink:
    command: "rm -f $HOME/go/bin/queen"

  fmt:
    command: "go fmt ./..."
    inputs:
      - "**/*.go"

  vet:
    command: "go vet ./..."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  deps:
    script: "go mod download && go mod tidy"
    inputs:
      - "go.mod"
    outputs:
      - "go.sum"
