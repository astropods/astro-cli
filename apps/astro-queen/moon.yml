layer: "application"
language: "go"

tasks:
  build:
    command: "go build -o bin/astro-queen ."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-proto/**"
    outputs:
      - "bin/astro-queen"

  # Run the TUI against a local astro-server (no TLS).
  # Override: ASTRO_QUEEN_SERVER=host:9091 moon run astro-queen:run
  run:
    command: "./bin/astro-queen --server $ASTRO_QUEEN_SERVER"
    deps:
      - "build"
    env:
      ASTRO_QUEEN_SERVER: "localhost:9091"
    options:
      persistent: true
      cache: false

  # Run with mTLS using ~/.astro-queen/config.yaml (written by astro-server:gen-admin-certs).
  # Override config path: ASTRO_QUEEN_CONFIG=~/other.yaml moon run astro-queen:run-tls
  run-tls:
    command: "./bin/astro-queen --config $ASTRO_QUEEN_CONFIG"
    deps:
      - "build"
    env:
      ASTRO_QUEEN_CONFIG: "~/.astro-queen/config.yaml"
    options:
      persistent: true
      cache: false

  link:
    command: "ln -sf $(pwd)/bin/astro-queen $HOME/go/bin/astro-queen"
    deps:
      - "build"

  fmt:
    command: "go fmt ./..."
    inputs:
      - "**/*.go"

  vet:
    command: "go vet ./..."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  deps:
    script: "go mod download && go mod tidy"
    inputs:
      - "go.mod"
    outputs:
      - "go.sum"
