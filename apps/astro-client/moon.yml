layer: "application"
language: "typescript"

tasks:
  typecheck:
    command: "bun run typecheck"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "react-router.config.ts"
    options:
      mergeArgs: "replace"
      mergeInputs: "replace"

  test:
    command: "bun x vitest run"
    inputs:
      - "src/**/*"
      - "vite.config.ts"

  dev:
    command: "bun run dev"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "vite.config.ts"
