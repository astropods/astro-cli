layer: "application"
language: "typescript"

tasks:
  typecheck:
    command: "bun run typecheck"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "react-router.config.ts"
    options:
      mergeArgs: "replace"
      mergeInputs: "replace"

  test:
    command: "bun x vitest run"
    inputs:
      - "src/**/*"
      - "vite.config.ts"

  e2e.setup:
    command: "bun x playwright install chromium"
    inputs:
      - "package.json"

  e2e:
    command: "bun run test:e2e"
    deps:
      - "e2e.setup"
      - "astro-theme:build"
      - "astro-identity-gen:build"
      - "astro-trading-card:build"
    inputs:
      - "e2e/**/*"
      - "playwright.config.ts"
      - "src/**/*"
      - "package.json"

  dev:
    command: "bun run dev"
    deps:
      - "astro-theme:build"
      - "astro-identity-gen:build"
      - "astro-trading-card:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "vite.config.ts"
