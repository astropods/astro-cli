layer: "application"
language: "typescript"

tasks:
  typecheck:
    command: "bun run typecheck"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "react-router.config.ts"
    options:
      mergeArgs: "replace"
      mergeInputs: "replace"

  test:
    command: "bun x vitest run"
    inputs:
      - "src/**/*"
      - "eslint-rules/**/*"
      - "vite.config.ts"

  lint:
    command: "bun run lint"
    inputs:
      - "src/**/*"
      - "eslint.config.js"
      - "eslint-rules/**/*"
      - "eslint-suppressions.json"
      - "package.json"

  e2e.setup:
    command: "bun x playwright install chromium"
    inputs:
      - "package.json"

  e2e:
    command: "bun run test:e2e"
    deps:
      - "e2e.setup"
      - "astro-theme:build"
      - "astro-trading-card:build"
    inputs:
      - "e2e/**/*"
      - "playwright.config.ts"
      - "src/**/*"
      - "package.json"

  dev:
    command: "bun run dev"
    deps:
      - "astro-theme:build"
      - "astro-trading-card:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "vite.config.ts"

  # Standalone, SSR-free chat bundle embedded into the astro CLI. Output is
  # copied into apps/astro-cli/internal/chatui/webdist during the CLI release
  # build (named webdist, not dist — the repo-root .gitignore ignores "dist").
  build-chat-embed:
    command: "bun run build:chat-embed"
    deps:
      - "astro-theme:build"
    inputs:
      - "src/**/*"
      - "chat-embed.html"
      - "vite.chat-embed.config.ts"
      - "package.json"
    outputs:
      - "chat-embed-dist/**/*"
