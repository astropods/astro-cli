<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat | Astro</title>
    <script>
      (function () {
        var t = localStorage.getItem("astro:theme") || "dark";
        if (t === "auto")
          t = window.matchMedia("(prefers-color-scheme:dark)").matches
            ? "dark"
            : "light";
        document.documentElement.classList.toggle("dark", t === "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/chat-embed/main.tsx"></script>
  </body>
</html>
