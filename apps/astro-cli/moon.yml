layer: "application"
language: "go"

tasks:
  clean:
    command: "rm -rf bin/ast-dev"
    options:
      cache: false

  # Copy astro-client's prebuilt chat SPA into the CLI embed dir so `go build`
  # ships the real chat UI (queen-style). Clears the dir first (preserving the
  # tracked .gitkeep) so content-hashed bundles from prior builds don't pile up
  # and get baked into the binary via `go:embed all:webdist`.
  embed-chat-ui:
    command: "sh -c 'find internal/chatui/webdist -mindepth 1 ! -name .gitkeep -delete && cp -R ../astro-client/chat-embed-dist/. internal/chatui/webdist/'"
    deps:
      - "astro-client:build-chat-embed"
    options:
      cache: false

  build:
    command: sh -c 'go build -ldflags="-X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.BinaryName=ast-dev -X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.Commit=$(git rev-parse --short HEAD) -X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.DefaultServerURL=${ASTRO_SERVER_URL:-http://localhost:8080} -X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.AmplitudeAPIKey=${AMPLITUDE_API_KEY:-}" -o bin/ast-dev .'
    deps:
      - "embed-chat-ui"
    inputs:
      - "**/*.go"
      - "cmd/docs/**"
      - "internal/scaffold/templates/**"
      - "internal/chatui/webdist/**"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-spec/**"
      - "/.git/refs/heads/*"
    outputs:
      - "bin/ast-dev"

  build-preview:
    command: sh -c 'go build -ldflags="-X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.BinaryName=ast-preview -X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.Version=$(cat VERSION) -X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.Commit=$(git rev-parse --short HEAD) -X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.DefaultServerURL=https://astropod.ai -X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.FleetServerURL=fleet.astropod.ai:9092 -X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.AmplitudeAPIKey=${AMPLITUDE_API_KEY:-}" -o bin/ast-preview .'
    deps:
      - "embed-chat-ui"
    inputs:
      - "**/*.go"
      - "cmd/docs/**"
      - "internal/scaffold/templates/**"
      - "internal/chatui/webdist/**"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-spec/**"
      - "/.git/refs/heads/*"
    outputs:
      - "bin/ast-preview"

  link:
    command: "ln -sf $(pwd)/bin/ast-dev $HOME/go/bin/ast-dev"
    deps:
      - "build"

  link-preview:
    command: "ln -sf $(pwd)/bin/ast-preview $HOME/go/bin/ast-preview"
    deps:
      - "build-preview"

  unlink:
    command: "rm -f $HOME/go/bin/ast-dev"

  test:
    command: "go test -v ./cmd/... ./internal/..."
    options:
      persistent: false
      cache: true
    inputs:
      - "cmd/**/*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-spec/**"

  e2e:
    command: "go test -tags integration -v ./e2e/..."
    options:
      persistent: false
      runInCI: false
      cache: false
    inputs:
      - "e2e/**/*.go"
      - "cmd/**/*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-spec/**"
