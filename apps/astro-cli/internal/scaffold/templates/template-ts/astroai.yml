spec: astro/v1
name: {{.Name}}

meta:
  version: 0.1.0
  description: {{.Description}}

agent:
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NPM_SCOPE: "@saswatds"
      NPM_REGISTRY: "https://npm.pkg.github.com"
    secrets:
      - id: npm_token
        env: GITHUB_PACKAGES_TOKEN
{{- if or (ne .ModelProvider "") (.HasIntegration "anthropic") (.HasIntegration "openai")}}

models:
{{- if ne .ModelProvider ""}}
  default:
    provider: {{.ModelProvider}}
{{- if ne .Model ""}}
    model: {{.Model}}
{{- end}}
{{- end}}
{{- range .Integrations}}
{{- if eq . "anthropic"}}
  anthropic:
    provider: anthropic
{{- else if eq . "openai"}}
  openai:
    provider: openai
{{- end}}
{{- end}}
{{- end}}
{{- if gt (len .Knowledge) 0}}

knowledge:
{{- if .HasKnowledge "qdrant"}}
  docs:
    provider: qdrant
    persistent: true
{{- end}}
{{- if .HasKnowledge "redis"}}
  cache:
    provider: redis
{{- end}}
{{- if .HasKnowledge "neo4j"}}
  graph:
    provider: neo4j
{{- end}}
{{- end}}
{{- if .HasIntegration "github"}}

tools:
  github:
    provider: github
{{- end}}
{{- if ne .Ingestion "none"}}

ingestion:
  data:
    container:
      build:
        context: .
        dockerfile: Dockerfile.ingestion
        args:
          NPM_SCOPE: "@saswatds"
          NPM_REGISTRY: "https://npm.pkg.github.com"
        secrets:
          - id: npm_token
            env: GITHUB_PACKAGES_TOKEN
{{- if eq .Ingestion "webhook"}}
      port: 3001
{{- end}}
    trigger:
{{- if eq .Ingestion "schedule"}}
      type: schedule
{{- else if eq .Ingestion "webhook"}}
      type: webhook
{{- else if eq .Ingestion "manual"}}
      type: manual
{{- else if eq .Ingestion "startup"}}
      type: startup
{{- end}}
{{- end}}
{{- if or (gt (len .Interfaces) 0) (eq .Ingestion "schedule")}}

dev:
{{- if gt (len .Interfaces) 0}}
  interfaces: [{{- range $i, $v := .Interfaces}}{{if $i}}, {{end}}{{$v}}{{- end}}]
{{- end}}
{{- if eq .Ingestion "schedule"}}
  schedules:
    data: "0 * * * *"  # every hour
{{- end}}
{{- end}}
