layer: "application"
language: "go"

tasks:
  # Development
  dev:
    command: "bash scripts/dev.sh"
    preset: "server"
    options:
      persistent: true

  # Build & test
  build:
    command: "go build -o bin/astro-server ."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-proto/**"
    outputs:
      - "bin/astro-server"

  # Unit tests (default build tags). CI runs the same suite in the
  # `Test Go applications (astro-server)` matrix leg via gotestsum; PRs skip
  # -race, main pushes enable it. Lint runs through golangci-lint-action with
  # the repo-root .golangci.yaml (govet is covered there — no separate vet step).
  test:
    command: "gotestsum --format testdox --hide-summary skipped -- -v ./..."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  # Billing suite. Runs without Postgres, Kubernetes, or a browser, and says so:
  # the SQL-backed billing tests are skipped unless DATABASE_URL is set, and the
  # run reports itself partial when they are. test-integration runs them.
  test-billing:
    command: "bash scripts/test-billing.sh"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "scripts/test-billing.sh"

  # Code quality
  fmt:
    command: "go fmt ./..."
    inputs:
      - "**/*.go"

  vet:
    # Local-only sanity check; CI relies on golangci-lint's govet linter instead.
    command: "go vet ./..."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  lint:
    # Local equivalent of CI's golangci-lint-action step (.github/workflows/test.yml).
    # CI uses a 10m analysis timeout to tolerate cold-cache runs on astro-server.
    command: "golangci-lint run"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"

  # E2E tests (require external infra: vcluster + Postgres)
  e2e:
    command: "bash $MOON_WORKSPACE_ROOT/scripts/e2e.sh all"
    options:
      persistent: false
      runInCI: false
    inputs:
      - "e2e/**/*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - "/sql/**"
      - "/scripts/e2e.sh"

  # Postgres-only integration tests (//go:build integration). Mirrors the
  # CI `test-go-integration` job. Skips the kind/vcluster setup that
  # `e2e` needs, so it's the right command for the lineage / store /
  # backfill tests under apps/astro-server/e2e/ that don't touch K8s.
  test-integration:
    command: "bash $MOON_WORKSPACE_ROOT/scripts/e2e.sh integration"
    options:
      persistent: false
      runInCI: false
    inputs:
      - "e2e/**/*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - "/sql/**"
      - "/scripts/e2e.sh"

  e2e.setup:
    command: "bash $MOON_WORKSPACE_ROOT/scripts/e2e.sh setup"
    options:
      persistent: false
      runInCI: false
      cache: false

  e2e.teardown:
    command: "bash $MOON_WORKSPACE_ROOT/scripts/e2e.sh teardown"
    options:
      persistent: false
      runInCI: false
      cache: false

  # Dependencies
  deps:
    script: "go mod download && go mod tidy"
    inputs:
      - "go.mod"
    outputs:
      - "go.sum"
