layer: "application"
language: "go"

tasks:
  # Development
  dev:
    command: "bash scripts/dev.sh"
    preset: "server"
    options:
      persistent: true

  # Build & test
  build:
    command: "go build -o bin/astro-server main.go"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-proto/**"
    outputs:
      - "bin/astro-server"

  test:
    command: "go test -v ./..."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  # Code quality
  fmt:
    command: "go fmt ./..."
    inputs:
      - "**/*.go"

  vet:
    command: "go vet ./..."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  lint:
    command: "golangci-lint run"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"

  # E2E tests (require external infra: vcluster + Postgres)
  e2e:
    command: "bash $MOON_WORKSPACE_ROOT/scripts/e2e.sh all"
    options:
      persistent: false
      runInCI: false
    inputs:
      - "e2e/**/*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - "/sql/**"
      - "/scripts/e2e.sh"

  e2e.setup:
    command: "bash $MOON_WORKSPACE_ROOT/scripts/e2e.sh setup"
    options:
      persistent: false
      runInCI: false
      cache: false

  e2e.teardown:
    command: "bash $MOON_WORKSPACE_ROOT/scripts/e2e.sh teardown"
    options:
      persistent: false
      runInCI: false
      cache: false

  # Dependencies
  deps:
    script: "go mod download && go mod tidy"
    inputs:
      - "go.mod"
    outputs:
      - "go.sum"
