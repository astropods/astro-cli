layer: "application"
language: "go"

tasks:
  # Development
  dev:
    command: "bash scripts/dev.sh"
    preset: "server"
    options:
      persistent: true

  # Build & test
  build:
    command: "go build -o bin/astro-server main.go"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-proto/**"
    outputs:
      - "bin/astro-server"

  test:
    command: "go test -v ./..."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  # Code quality
  fmt:
    command: "go fmt ./..."
    inputs:
      - "**/*.go"

  vet:
    command: "go vet ./..."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  lint:
    command: "golangci-lint run"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"

  # Dependencies
  deps:
    script: "go mod download && go mod tidy"
    inputs:
      - "go.mod"
    outputs:
      - "go.sum"

  # Generate self-signed mTLS certs for local admin gRPC development.
  # Outputs land in .certs/ (gitignored). Also writes ~/.astro-queen/config.yaml.
  gen-admin-certs:
    command: "bash scripts/gen-admin-certs.sh"
    outputs:
      - ".certs/ca.crt"
      - ".certs/server.crt"
      - ".certs/server.key"
      - ".certs/client.crt"
      - ".certs/client.key"
    options:
      cache: false
