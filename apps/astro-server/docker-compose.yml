services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: astro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Declarative schema migration (Atlas diffes schema.sql against the live DB)
  migrate:
    image: arigaio/atlas:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../sql/astro-server/schema.sql:/schema.sql
    command:
      - schema
      - apply
      - --url
      - postgres://postgres:postgres@postgres:5432/astro?sslmode=disable
      - --to
      - file://schema.sql
      - --dev-url
      - postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - --exclude
      - atlas_schema_revisions,river
      - --auto-approve

  # Versioned migrations for River queue tables (Atlas migrate apply)
  migrate-river:
    image: arigaio/atlas:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../../sql/river:/migrations
    command:
      - migrate
      - apply
      - --url
      - postgres://postgres:postgres@postgres:5432/astro?sslmode=disable
      - --dir
      - file:///migrations
      - --revisions-schema
      - atlas_schema_revisions
      - --allow-dirty

volumes:
  postgres_data:
