root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/astro-server"
  cmd = "go build -o ./tmp/astro-server ."
  delay = 500
  exclude_dir = ["tmp", "vendor", "migrations", "bin", "scripts"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  kill_delay = "0s"
  log = "tmp/build-errors.log"
  stop_on_error = true
  send_interrupt = true

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true
