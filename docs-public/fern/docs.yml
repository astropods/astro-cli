# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: astro-061127.docs.buildwithfern.com
    custom-domain: docs.astropods.ai
    audiences:
      - internal

ai-search:
  location:
    - docs

title: Astro AI | Documentation
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header

tabs:
  home:
    display-name: Docs
    icon: home
  CLI:
    display-name: CLI
    icon: terminal
  # API Reference:
  #   display-name: API Reference
  #   icon: puzzle

navigation:
  - tab: home
    layout:
      - section: Get started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-duotone fa-house
          - page: Install the CLI
            path: docs/pages/install-cli.mdx
            icon: fa-duotone fa-download
          - page: Your first project
            path: docs/pages/get-started.mdx
            icon: fa-duotone fa-rocket
          - page: Make your agent discoverable
            path: docs/pages/agent-card.mdx
            icon: fa-duotone fa-id-card
          - page: Publish to registry
            path: docs/pages/publish-to-registry.mdx
            icon: fa-duotone fa-cloud-arrow-up
          - page: Authentication
            path: docs/pages/authentication.mdx
            icon: fa-duotone fa-key
      - section: Reference
        contents:
          - page: Astropods Spec
            path: docs/pages/astropods-package-spec.mdx
            icon: fa-duotone fa-file-lines
          - page: Agent Card Spec
            path: docs/pages/agent-card-spec.mdx
            icon: fa-duotone fa-file-lines
          - page: Known Integrations
            path: docs/pages/known-integrations.mdx
            icon: fa-duotone fa-plug
  #     - section: Changelog
  #       contents:
  #         - changelog: docs/changelog
  - tab: CLI
    layout:
      - section: Overview
        contents:
          - page: Overview
            path: docs/pages/cli-overview.mdx
            icon: fa-duotone fa-terminal
      - section: Commands
        contents:
          - page: Reference
            path: docs/pages/cli-reference.mdx
            icon: fa-duotone fa-list
  # - tab: API Reference
  #   layout:
  #     - section: Overview
  #       contents:
  #         - page: API reference
  #           path: docs/pages/api-reference-overview.mdx
  #           icon: fa-duotone fa-book
  #     - section: Endpoints
  #       contents:
  #         - api: Astro AI API
  #           api-name: astro-api

colors:
  accent-primary:
    dark: "#12766e"
    light: "#12766e"
  background:
    dark: "#01031a"
    light: "#f5f5f4"

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: docs/assets/new-logo-white.svg
  light: docs/assets/new-logo.svg
  height: 24
  href: /welcome

favicon: docs/assets/favicon.svg

css: docs/assets/styles.css

navbar-links:
  - type: minimal
    text: ""
    href: https://github.com/astropods
    icon: fa-brands fa-github
  - type: minimal
    text: Community
    href: https://join.slack.com/t/astro-wg65154/shared_invite/zt-3sh3mr1qu-5LNU45p7Ox_HclvZzkmxkg
  - type: filled
    text: Website
    href: https://astropods.com