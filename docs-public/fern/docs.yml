# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: astro-061127.docs.buildwithfern.com
    custom-domain: docs.astropods.com
    audiences:
      - internal

ai-search:
  location:
    - docs

title: Astro AI | Documentation
footer: ./docs/components/AstroFooter.tsx
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header

tabs:
  home:
    display-name: Docs
    icon: home
  CLI:
    display-name: CLI
    icon: terminal
  api:
    display-name: API Reference
    icon: puzzle

redirects:
  # publish-to-registry merged into the blueprints guide
  - source: "/publish-to-registry"
    destination: "/blueprints"
  # removed Fern starter-template pages
  - source: "/writing-content"
    destination: "/welcome"
  - source: "/editing-your-docs"
    destination: "/welcome"
  - source: "/navigation"
    destination: "/welcome"
  - source: "/customization"
    destination: "/welcome"
  - source: "/support"
    destination: "/welcome"

navigation:
  - tab: home
    layout:
      - section: Get started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-duotone fa-house
          - page: Install the CLI
            path: docs/pages/install-cli.mdx
            icon: fa-duotone fa-download
          - page: Your first project
            path: docs/pages/get-started.mdx
            icon: fa-duotone fa-rocket
          - page: Your first blueprint
            path: docs/pages/blueprints.mdx
            icon: fa-duotone fa-cube
          - page: Deploy your first agent
            path: docs/pages/deploy-agent.mdx
            icon: fa-duotone fa-bolt
          - page: Managing your agents
            path: docs/pages/managing-agents.mdx
            icon: fa-duotone fa-sliders
          - page: Authentication
            path: docs/pages/authentication.mdx
            icon: fa-duotone fa-key
      - section: Platform
        contents:
          - page: Working with accounts
            path: docs/pages/accounts.mdx
            icon: fa-duotone fa-users
          - page: Managing secrets
            path: docs/pages/secrets.mdx
            icon: fa-duotone fa-lock
          - page: AI Gateway
            path: docs/pages/ai-gateway.mdx
            icon: fa-duotone fa-brain-circuit
          - page: Agent Card
            path: docs/pages/agent-card.mdx
            icon: fa-duotone fa-id-card
          - page: Knowledge stores
            path: docs/pages/knowledge-stores.mdx
            icon: fa-duotone fa-database
      - section: Monitor your agents
        contents:
          - page: Overview
            path: docs/pages/monitor-agents.mdx
            icon: fa-duotone fa-chart-line
          - section: Frameworks
            contents:
              - page: AI SDK
                path: docs/pages/monitor-ai-sdk.mdx
                icon: fa-duotone fa-sparkles
              - page: Mastra
                path: docs/pages/monitor-mastra.mdx
                icon: fa-duotone fa-cube
              - page: Claude Agent SDK
                path: docs/pages/monitor-claude-agent-sdk.mdx
                icon: fa-duotone fa-robot
      - section: Monitor external agents
        contents:
          - page: Overview
            path: docs/pages/monitor-external-agents.mdx
            icon: fa-duotone fa-tower-broadcast
          - section: Integrations
            icon: fa-duotone fa-plug
            contents:
              - page: Claude Code
                path: docs/pages/monitor-claude-code.mdx
                icon: fa-duotone fa-terminal
      - section: Guides
        contents:
          - page: Using knowledge stores
            path: docs/pages/knowledge-store-agent.mdx
            icon: fa-duotone fa-database
          - page: Store data with SQLite
            path: docs/pages/agent-sqlite.mdx
            icon: fa-duotone fa-hard-drive
          - page: Serve a frontend from your agent
            path: docs/pages/frontend-agents.mdx
            icon: fa-duotone fa-window
          - page: Connect to OAuth-protected MCP servers
            path: docs/pages/mcp-oauth.mdx
            icon: fa-duotone fa-plug-circle-bolt
          - page: Manually authorize requests
            path: docs/pages/manual-authz.mdx
            icon: fa-duotone fa-shield-check
          - page: Troubleshooting stuck deployments
            path: docs/pages/troubleshooting-deployments.mdx
            icon: fa-duotone fa-triangle-exclamation
          - section: Messaging SDK
            icon: fa-duotone fa-messages
            contents:
              - page: Files in chat
                path: docs/pages/messaging-sdk/files-in-chat.mdx
                icon: fa-duotone fa-file-arrow-up
              - page: Node
                path: docs/pages/messaging-sdk/node.mdx
                icon: fa-brands fa-node-js
              - page: Python
                path: docs/pages/messaging-sdk/python.mdx
                icon: fa-brands fa-python
          - section: Adapters
            icon: fa-duotone fa-plug
            contents:
              - page: Overview
                path: docs/pages/adapters/overview.mdx
                icon: fa-duotone fa-circle-info
              - page: Mastra
                path: docs/pages/adapters/mastra.mdx
                icon: fa-brands fa-node-js
              - page: LangChain
                path: docs/pages/adapters/langchain.mdx
                icon: fa-brands fa-python
              - page: Custom adapter (Node)
                path: docs/pages/adapters/custom-node.mdx
                icon: fa-brands fa-node-js
              - page: Custom adapter (Python)
                path: docs/pages/adapters/custom-python.mdx
                icon: fa-brands fa-python
      - section: Reference
        contents:
          - page: Astropods Spec
            path: docs/pages/astropods-package-spec.mdx
            icon: fa-duotone fa-file-lines
          - page: Agent Card Spec
            path: docs/pages/agent-card-spec.mdx
            icon: fa-duotone fa-file-lines
          - page: Known integrations
            path: docs/pages/known-integrations.mdx
            icon: fa-duotone fa-plug
          - page: Allowlist egress IPs
            path: docs/pages/private-database.mdx
            icon: fa-duotone fa-shield-halved
      - section: Changelog
        contents:
          - changelog: "docs/changelog"
  - tab: CLI
    layout:
      - section: Overview
        contents:
          - page: Overview
            path: docs/pages/cli-overview.mdx
            icon: fa-duotone fa-terminal
      - section: Commands
        contents:
          - page: Reference
            path: docs/pages/cli-reference.mdx
            icon: fa-duotone fa-list
  - tab: api
    layout:
      - api: Astro AI API
        api-name: astro-api

colors:
  accent-primary:
    dark: "#a4b5fa"
    light: "#3e3bc9"
  background:
    dark: "#020617"
    light: "#f8fafc"

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: docs/assets/astro-logo-dark.svg
  light: docs/assets/astro-logo.svg
  height: 20
  href: /welcome

favicon: docs/assets/favicon.svg

css:
  - docs/assets/styles.css
  - docs/components/footer.css

js:
  - path: docs/transcend-loader.js
    strategy: beforeInteractive
  - path: docs/gpc-banner.js
    strategy: beforeInteractive
  - path: docs/dnss-regime.js
    strategy: beforeInteractive

navbar-links:
  - type: minimal
    text: ""
    href: https://github.com/astropods
    icon: fa-brands fa-github
  - type: minimal
    text: Join Discord
    href: https://discord.gg/68t2xzzRrE
  - type: filled
    text: Website
    href: https://astropods.com
