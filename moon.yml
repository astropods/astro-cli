layer: "application"
language: "go"

tasks:
  clean:
    command: "rm -rf bin/ast-dev"
    options:
      cache: false

  build:
    command: sh -c 'go build -ldflags="-X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.BinaryName=ast-dev -X github.com/astropods/astro/apps/astro-cli/cmd.commit=$(git rev-parse --short HEAD) -X github.com/astropods/astro/apps/astro-cli/internal/telemetry.AmplitudeAPIKey=${AMPLITUDE_API_KEY:-}" -o bin/ast-dev .'
    inputs:
      - "**/*.go"
      - "cmd/docs/**"
      - "internal/scaffold/templates/**"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-spec/**"
      - "/.git/refs/heads/*"
    outputs:
      - "bin/ast-dev"

  build-preview:
    command: sh -c 'go build -ldflags="-X github.com/astropods/astro/apps/astro-cli/internal/buildinfo.BinaryName=ast-preview -X github.com/astropods/astro/apps/astro-cli/cmd.version=$(cat VERSION) -X github.com/astropods/astro/apps/astro-cli/cmd.commit=$(git rev-parse --short HEAD) -X github.com/astropods/astro/apps/astro-cli/internal/auth.DefaultServerURL=https://astropod.ai -X github.com/astropods/astro/apps/astro-cli/internal/auth.FleetServerURL=fleet.astropod.ai:9092 -X github.com/astropods/astro/apps/astro-cli/internal/telemetry.AmplitudeAPIKey=${AMPLITUDE_API_KEY:-}" -o bin/ast-preview .'
    inputs:
      - "**/*.go"
      - "cmd/docs/**"
      - "internal/scaffold/templates/**"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-spec/**"
      - "/.git/refs/heads/*"
    outputs:
      - "bin/ast-preview"

  link:
    command: "ln -sf $(pwd)/bin/ast-dev $HOME/go/bin/ast-dev"
    deps:
      - "build"

  link-preview:
    command: "ln -sf $(pwd)/bin/ast-preview $HOME/go/bin/ast-preview"
    deps:
      - "build-preview"

  unlink:
    command: "rm -f $HOME/go/bin/ast-dev"

  test:
    command: "go test -v ./cmd/... ./internal/..."
    options:
      persistent: false
      cache: true
    inputs:
      - "cmd/**/*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-spec/**"

  e2e:
    command: "go test -tags integration -v ./e2e/..."
    options:
      persistent: false
      runInCI: false
      cache: false
    inputs:
      - "e2e/**/*.go"
      - "cmd/**/*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - "/packages/astro-spec/**"
