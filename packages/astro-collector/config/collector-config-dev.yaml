receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
  batch:
    timeout: 5s
    send_batch_size: 256
  astro:
    agent_name: ${env:ASTRO_AGENT_NAME:-unknown}
    agent_version: ${env:ASTRO_AGENT_VERSION:-unknown}
    deployment_id: ${env:ASTRO_DEPLOYMENT_ID:-unknown}
    redact_prompts: ${env:ASTRO_REDACT_PROMPTS:-false}

exporters:
  debug:
    verbosity: ${env:COLLECTOR_DEBUG_VERBOSITY:-detailed}

service:
  telemetry:
    logs:
      level: ${env:COLLECTOR_LOG_LEVEL:-info}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, astro]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
