<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Trading Card Dev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a1f; color: #e0e0e0; padding: 40px; }
    h1 { margin-bottom: 24px; font-size: 20px; opacity: 0.6; }
    .avatar-row {
      display: flex; gap: 12px; margin-bottom: 32px;
      padding-bottom: 24px; border-bottom: 1px solid #222;
    }
    .avatar-pick {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 8px; border-radius: 12px; border: 2px solid transparent;
      text-decoration: none; color: #e0e0e0; cursor: pointer; background: none;
    }
    .avatar-pick:hover { border-color: #444; }
    .avatar-pick.active { border-color: #6366f1; }
    .avatar-pick span { font-size: 10px; opacity: 0.5; }
    .avatar-pick svg, .avatar-pick img { border-radius: 8px; display: block; }
    .downloads {
      margin-top: 24px;
      display: flex; gap: 8px;
    }
    .downloads button {
      padding: 6px 14px; border-radius: 8px; border: 1px solid #333;
      background: #222; color: #e0e0e0; cursor: pointer; font-size: 12px;
    }
    .downloads button:hover { border-color: #555; }
  </style>
</head>
<body>
  <h1>astro-trading-card</h1>
  <div class="avatar-row" id="avatar-row"></div>
  <astro-trading-card></astro-trading-card>
  <div class="downloads">
    <button id="dl-svg">Download SVG</button>
    <button id="dl-png">Download PNG</button>
  </div>
  <script type="module" src="./dev-client.ts"></script>
</body>
</html>
