language: "typescript"
type: "library"

tasks:
  build:
    command: "bun run build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "/tsconfig.base.json"
    outputs:
      - "dist"

  typecheck:
    command: "bun run typecheck"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "/tsconfig.base.json"
    options:
      mergeArgs: "replace"

  clean:
    command: "rm -rf dist"
