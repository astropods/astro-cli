spec: astro/v1
name: engineering-assistant

meta:
  version: 1.0.0
  description: Engineering knowledge assistant with self-hosted embeddings and vector store
  tags: [engineering, support, internal, example]

agent:
  build:
    context: ../..
    dockerfile: astro-agents/engineering-assistant/Dockerfile
    secrets:
      - id: npm_token
        env: GITHUB_PACKAGES_TOKEN

models:
  embedder:
    container:
      build:
        context: ./embedder
        dockerfile: Dockerfile
      port: 8000
      healthcheck:
        path: /health

knowledge:
  docs:
    provider: qdrant
    persistent: true

  cache:
    provider: redis

integrations:
  anthropic:
    provider: anthropic
    type: model

  github:
    provider: github
    type: tool
    config:
      scopes:
        - repo:read
        - issues:read

interfaces:
  slack:
    enabled: true
  web:
    enabled: true
