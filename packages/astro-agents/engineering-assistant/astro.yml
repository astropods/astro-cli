spec: astro/v1
agent: engineering-assistant

meta:
  version: 1.0.0
  description: Engineering knowledge assistant with self-hosted embeddings and vector store
  tags: [engineering, support, internal, example]
  owner: platform-team

container:
  build:
    context: ../..
    dockerfile: astro-agents/engineering-assistant/Dockerfile
    secrets:
      - id: npm_token
        env: GITHUB_PACKAGES_TOKEN

models:
  embedder:
    provider: sentence-transformers
    model: all-MiniLM-L6-v2
    config:
      dimensions: 384
    container:
      build:
        context: ./embedder
        dockerfile: Dockerfile
      port: 8000
      healthcheck:
        path: /health

knowledge:
  docs:
    type: vector
    provider: qdrant
    config:
      collection: engineering-docs
      dimensions: 384
      metric: cosine
    embedding: models.embedder
    container:
      image: qdrant/qdrant:latest
      persistent: true

  cache:
    type: kv
    provider: redis
    config:
      ttl: 3600
    container:
      image: redis:7-alpine

tools:
  doc_search:
    type: function
    config:
      runtime: python
      handler: tools/search.py
      functions:
        - name: search_docs
          description: Search internal documentation

integrations:
  models:
    - name: primary_llm
      provider: anthropic

  tools:
    - name: github
      provider: github
      config:
        scopes:
          - repo:read
          - issues:read

interfaces:
  slack:
    type: slack
  web:
    type: web
