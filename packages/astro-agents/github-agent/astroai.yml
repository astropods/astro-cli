apiVersion: astro.dev/v1
kind: Agent

metadata:
  name: github-agent
  version: 1.0.0
  description: Agent that can fetch and analyze GitHub repositories

runtime:
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    - name: NODE_ENV
      value: production
    - name: ANTHROPIC_API_KEY
      value: ${ANTHROPIC_API_KEY}

interface:
  type: http

inference:
  port: 8080
  config:
    timeout: 60s
    concurrency: 5
