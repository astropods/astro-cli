spec: astro/v1
name: obs-agent

meta:
  version: 0.1.0
  description: An AI-powered agent

agent:
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NPM_SCOPE: "@saswatds"
      NPM_REGISTRY: "https://npm.pkg.github.com"
    secrets:
      - id: npm_token
        env: GITHUB_PACKAGES_TOKEN

interfaces:
  web:
    type: web

integrations:
  openai:
    provider: openai
    type: model
