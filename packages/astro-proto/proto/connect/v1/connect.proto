syntax = "proto3";

package connect.v1;

option go_package = "github.com/postman/astro/packages/astro-proto/connect/v1;connectv1";

service ConnectService {
  rpc Connect(stream ClientMessage) returns (stream ServerMessage);
}

// --- Client -> Server ---

message ClientMessage {
  oneof payload {
    RegisterDevice register = 1;
    Heartbeat heartbeat = 2;
    CommandResult command_result = 3;
  }
}

message RegisterDevice {
  string device_id = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string cli_version = 5;
}

message Heartbeat {
  int64 timestamp_unix = 1;
  uint64 uptime_seconds = 2;
}

message CommandResult {
  string command_id = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
}

// --- Server -> Client ---

message ServerMessage {
  oneof payload {
    RegisterDeviceResponse register_ack = 1;
    ShellCommand command = 2;
    Disconnect disconnect = 3;
  }
}

message RegisterDeviceResponse {
  bool accepted = 1;
  string message = 2;
}

message ShellCommand {
  string command_id = 1;
  string shell = 2;
  string command = 3;
  string working_dir = 4;
  map<string, string> env = 5;
  uint32 timeout_seconds = 6;
}

message Disconnect {
  string reason = 1;
}
