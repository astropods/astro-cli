syntax = "proto3";

package admin.v1;

option go_package = "github.com/astropods/astro/packages/astro-proto/admin/v1;adminv1";

service AdminService {
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc DeleteDeployment(DeleteDeploymentRequest) returns (DeleteDeploymentResponse);
  rpc RestartDeployment(RestartDeploymentRequest) returns (RestartDeploymentResponse);
  rpc QueryDatabase(QueryDatabaseRequest) returns (QueryDatabaseResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgentBuilds(GetAgentBuildsRequest) returns (GetAgentBuildsResponse);
  rpc ProxyHTTP(HTTPProxyRequest) returns (HTTPProxyResponse);
  rpc GetAuthConfig(GetAuthConfigRequest) returns (GetAuthConfigResponse);
  rpc StartRiverUI(StartRiverUIRequest) returns (StartRiverUIResponse);
  rpc StopRiverUI(StopRiverUIRequest) returns (StopRiverUIResponse);
  rpc GetRiverUIStatus(GetRiverUIStatusRequest) returns (GetRiverUIStatusResponse);
  rpc ListJobKinds(ListJobKindsRequest) returns (ListJobKindsResponse);
  rpc TriggerJob(TriggerJobRequest) returns (TriggerJobResponse);
  rpc GetJobStates(GetJobStatesRequest) returns (GetJobStatesResponse);
  rpc ListAdminQueues(ListAdminQueuesRequest) returns (ListAdminQueuesResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc CancelJobs(CancelJobsRequest) returns (CancelJobsResponse);
  rpc RetryJobs(RetryJobsRequest) returns (RetryJobsResponse);
  rpc PauseQueue(PauseQueueRequest) returns (PauseQueueResponse);
  rpc ResumeQueue(ResumeQueueRequest) returns (ResumeQueueResponse);
  rpc ListQuotaIncreaseRequests(ListQuotaIncreaseRequestsRequest) returns (ListQuotaIncreaseRequestsResponse);
  rpc ApproveQuotaIncrease(ApproveQuotaIncreaseRequest) returns (ApproveQuotaIncreaseResponse);
  rpc DenyQuotaIncrease(DenyQuotaIncreaseRequest) returns (DenyQuotaIncreaseResponse);
  rpc GetDeploymentEvents(GetDeploymentEventsRequest) returns (GetDeploymentEventsResponse);
  rpc WakeUpDeployment(WakeUpDeploymentRequest) returns (WakeUpDeploymentResponse);
  rpc RollbackDeployment(RollbackDeploymentRequest) returns (RollbackDeploymentResponse);
  rpc ReapplyDeployment(ReapplyDeploymentRequest) returns (ReapplyDeploymentResponse);
  rpc GetPodLogs(GetPodLogsRequest) returns (GetPodLogsResponse);
  rpc ListFeedback(ListFeedbackRequest) returns (ListFeedbackResponse);
  rpc StopDeployment(StopDeploymentRequest) returns (StopDeploymentResponse);
  rpc RegisterCluster(RegisterClusterRequest) returns (RegisterClusterResponse);
  rpc EnableCluster(EnableClusterRequest) returns (EnableClusterResponse);
  rpc DisableCluster(DisableClusterRequest) returns (DisableClusterResponse);
  rpc DeregisterCluster(DeregisterClusterRequest) returns (DeregisterClusterResponse);
  rpc GetClusterBlockers(GetClusterBlockersRequest) returns (GetClusterBlockersResponse);
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc GetAccountMetronomeAliases(GetAccountMetronomeAliasesRequest) returns (MetronomeAliasStatus);
  rpc RecoverAccountMetronomeAliases(RecoverAccountMetronomeAliasesRequest) returns (MetronomeAliasStatus);
  rpc RegisterAccountMetronome(RegisterAccountMetronomeRequest) returns (RegisterAccountMetronomeResponse);
  rpc GetAccountBillingDetail(GetAccountBillingDetailRequest) returns (GetAccountBillingDetailResponse);
  rpc RetryBillingProvision(RetryBillingProvisionRequest) returns (RetryBillingProvisionResponse);
  rpc ForceBillingResume(ForceBillingResumeRequest) returns (ForceBillingResumeResponse);
  rpc RecoverAccountLangfuse(RecoverAccountLangfuseRequest) returns (RecoverAccountLangfuseResponse);
  rpc RecoverAccountBifrost(RecoverAccountBifrostRequest) returns (RecoverAccountBifrostResponse);
  rpc RenameAccount(RenameAccountRequest) returns (RenameAccountResponse);
  rpc SetAccountCluster(SetAccountClusterRequest) returns (SetAccountClusterResponse);
  rpc MigrateAccountDeployments(MigrateAccountDeploymentsRequest) returns (MigrateAccountDeploymentsResponse);
  rpc UpdateCluster(UpdateClusterRequest) returns (UpdateClusterResponse);
  rpc CheckClusterHealth(CheckClusterHealthRequest) returns (CheckClusterHealthResponse);
  rpc InvalidateAccountCaches(InvalidateAccountCachesRequest) returns (InvalidateCachesResponse);
  rpc InvalidateAllCaches(InvalidateAllCachesRequest) returns (InvalidateCachesResponse);
  rpc ListClusterMigrations(ListClusterMigrationsRequest) returns (ListClusterMigrationsResponse);
  rpc ListOutboundDomains(ListOutboundDomainsRequest) returns (ListOutboundDomainsResponse);
  rpc RefreshMessagingCache(RefreshMessagingCacheRequest) returns (RefreshMessagingCacheResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  rpc ClearAlert(ClearAlertRequest) returns (ClearAlertResponse);
  rpc MuteAlert(MuteAlertRequest) returns (MuteAlertResponse);
  rpc UnmuteAlert(UnmuteAlertRequest) returns (UnmuteAlertResponse);
}

message ListDeploymentsRequest {
  string namespace = 1; // optional filter
}

message AdminDeployment {
  string name = 1;
  string build_id = 2;
  string namespace = 3;
  string status = 4;
  string created_at = 5;
  string account_name = 6;
  repeated string components = 7;
  string deployment_id = 8;
  string error_message = 9;
  string status_changed_at = 10;
  int32 current_revision = 11;
  string owner_email = 12;
  string cluster_id = 13;           // deployments.cluster_id; empty = primary
  string account_cluster_id = 14;   // accounts.cluster_id; empty = primary
  bool placement_mismatch = 15;     // account vs deployment routing differ
  string account_id = 16;           // owning account UUID
}

message AdminDeploymentEvent {
  string status = 1;
  string message = 2;
  string created_at = 3;
}

message AdminDeploymentRevision {
  int32 revision = 1;
  string build_id = 2;
  string created_at = 3;
}

message ListDeploymentsResponse {
  repeated AdminDeployment deployments = 1;
  int32 count = 2;
}

message GetClusterStatusRequest {
  string namespace = 1; // empty = all namespaces
}

message K8sDeploymentInfo {
  string name = 1;
  string namespace = 2;
  int32 replicas = 3;
  int32 ready_replicas = 4;
  int32 available_replicas = 5;
  map<string, string> labels = 6;
  string created_at = 7;
}

message K8sPodInfo {
  string name = 1;
  string namespace = 2;
  string phase = 3;
  string node_name = 4;
  string pod_ip = 5;
  map<string, string> labels = 6;
  string created_at = 7;
}

message K8sServicePort {
  string name = 1;
  int32 port = 2;
  string target_port = 3;
  string protocol = 4;
}

message K8sServiceInfo {
  string name = 1;
  string namespace = 2;
  string type = 3;
  string cluster_ip = 4;
  repeated string external_ip = 5;
  repeated K8sServicePort ports = 6;
  map<string, string> labels = 7;
  string created_at = 8;
}

message ClusterSummary {
  int32 total_deployments = 1;
  int32 total_pods = 2;
  int32 running_pods = 3;
  int32 pending_pods = 4;
  int32 failed_pods = 5;
  int32 total_services = 6;
}

message GetClusterStatusResponse {
  string timestamp = 1;
  string namespace = 2;
  repeated K8sDeploymentInfo deployments = 3;
  repeated K8sPodInfo pods = 4;
  repeated K8sServiceInfo services = 5;
  ClusterSummary summary = 6;
  string resolved_cluster_id = 7; // K8s API cluster used for this request; empty = primary
}

message ListImagesRequest {}

message ImageInfo {
  string repository = 1;
  string namespace = 2;
  string name = 3;
  repeated string tags = 4;
}

message ListImagesResponse {
  repeated ImageInfo images = 1;
  int32 count = 2;
}

message DeleteDeploymentRequest {
  string namespace = 1;
}

message DeleteDeploymentResponse {
  string status = 1;
}

message RestartDeploymentRequest {
  string namespace = 1;
  string pod = 2;
}

message RestartDeploymentResponse {
  string status = 1;
}

message QueryDatabaseRequest {
  string query = 1;
}

message Row {
  repeated string values = 1;
}

message QueryDatabaseResponse {
  repeated string columns = 1;
  repeated Row rows = 2;
}

message ListAgentsRequest {}

message AdminAgent {
  string account_name = 1;
  string name = 2;
  int32 build_count = 3;
  // Field 4 reserved (was published_build_count)
  string latest_build_id = 5;
  string created_at = 6;
  string updated_at = 7;
}

message ListAgentsResponse {
  repeated AdminAgent agents = 1;
  int32 count = 2;
}

message GetAgentBuildsRequest {
  string account_name = 1;
  string agent_name = 2;
}

message AgentBuild {
  string build_id = 1;
  string published_at = 2;
  string updated_at = 3;
  // Field 4 reserved (was tagged_version)
}

message GetAgentBuildsResponse {
  repeated AgentBuild builds = 1;
  int32 count = 2;
