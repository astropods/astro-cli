}

message AdminQueue {
  string name = 1;
  int64 count_available = 2;
  int64 count_running = 3;
  string paused_at = 4;
  string updated_at = 5;
}

message ListAdminQueuesRequest {}

message ListAdminQueuesResponse {
  repeated AdminQueue queues = 1;
}

message PauseQueueRequest {
  string name = 1;
}

message PauseQueueResponse {}

message ResumeQueueRequest {
  string name = 1;
}

message ResumeQueueResponse {}

message QuotaIncreaseRequestProto {
  string id = 1;
  string account_id = 2;
  string account_name = 3;
  string feature_key = 4;
  double current_usage = 5;
  double current_quota = 6;
  double requested_amount = 7;
  string reason = 8;
  string status = 9;
  string requested_by = 10;
  string resolved_by = 11;
  string resolved_at = 12;
  string resolution_note = 13;
  double grant_amount = 14;
  string created_at = 15;
}

message ListQuotaIncreaseRequestsRequest {
  string status = 1;
}

message ListQuotaIncreaseRequestsResponse {
  repeated QuotaIncreaseRequestProto requests = 1;
