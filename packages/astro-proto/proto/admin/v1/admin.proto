  string created_at = 5;
  repeated AdminJobError errors = 6;
  string finalized_at = 7;
  string kind = 8;
  int32 max_attempts = 9;
  int32 priority = 10;
  string queue = 11;
  string scheduled_at = 12;
  string state = 13;
  repeated string tags = 14;
}

message ListJobsRequest {
