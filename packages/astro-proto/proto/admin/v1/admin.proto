syntax = "proto3";

package admin.v1;

option go_package = "github.com/astropods/astro/packages/astro-proto/admin/v1;adminv1";

service AdminService {
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc DeleteDeployment(DeleteDeploymentRequest) returns (DeleteDeploymentResponse);
  rpc RestartDeployment(RestartDeploymentRequest) returns (RestartDeploymentResponse);
  rpc QueryDatabase(QueryDatabaseRequest) returns (QueryDatabaseResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgentBuilds(GetAgentBuildsRequest) returns (GetAgentBuildsResponse);
  rpc ProxyOpenMeter(OpenMeterProxyRequest) returns (OpenMeterProxyResponse);
  rpc ProxyHTTP(HTTPProxyRequest) returns (HTTPProxyResponse);
  rpc GetAuthConfig(GetAuthConfigRequest) returns (GetAuthConfigResponse);
  rpc StartRiverUI(StartRiverUIRequest) returns (StartRiverUIResponse);
  rpc StopRiverUI(StopRiverUIRequest) returns (StopRiverUIResponse);
  rpc GetRiverUIStatus(GetRiverUIStatusRequest) returns (GetRiverUIStatusResponse);
  rpc ListJobKinds(ListJobKindsRequest) returns (ListJobKindsResponse);
  rpc TriggerJob(TriggerJobRequest) returns (TriggerJobResponse);
  rpc GetJobStates(GetJobStatesRequest) returns (GetJobStatesResponse);
  rpc ListAdminQueues(ListAdminQueuesRequest) returns (ListAdminQueuesResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc CancelJobs(CancelJobsRequest) returns (CancelJobsResponse);
  rpc RetryJobs(RetryJobsRequest) returns (RetryJobsResponse);
  rpc PauseQueue(PauseQueueRequest) returns (PauseQueueResponse);
  rpc ResumeQueue(ResumeQueueRequest) returns (ResumeQueueResponse);
  rpc ListQuotaIncreaseRequests(ListQuotaIncreaseRequestsRequest) returns (ListQuotaIncreaseRequestsResponse);
  rpc ApproveQuotaIncrease(ApproveQuotaIncreaseRequest) returns (ApproveQuotaIncreaseResponse);
  rpc DenyQuotaIncrease(DenyQuotaIncreaseRequest) returns (DenyQuotaIncreaseResponse);
  rpc GetDeploymentEvents(GetDeploymentEventsRequest) returns (GetDeploymentEventsResponse);
  rpc WakeUpDeployment(WakeUpDeploymentRequest) returns (WakeUpDeploymentResponse);
  rpc RollbackDeployment(RollbackDeploymentRequest) returns (RollbackDeploymentResponse);
  rpc ReapplyDeployment(ReapplyDeploymentRequest) returns (ReapplyDeploymentResponse);
  rpc GetPodLogs(GetPodLogsRequest) returns (GetPodLogsResponse);
  rpc ListFeedback(ListFeedbackRequest) returns (ListFeedbackResponse);
  rpc StopDeployment(StopDeploymentRequest) returns (StopDeploymentResponse);
  rpc RegisterCluster(RegisterClusterRequest) returns (RegisterClusterResponse);
  rpc EnableCluster(EnableClusterRequest) returns (EnableClusterResponse);
  rpc DisableCluster(DisableClusterRequest) returns (DisableClusterResponse);
  rpc DeregisterCluster(DeregisterClusterRequest) returns (DeregisterClusterResponse);
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc RenameAccount(RenameAccountRequest) returns (RenameAccountResponse);
  rpc SetAccountCluster(SetAccountClusterRequest) returns (SetAccountClusterResponse);
  rpc UpdateCluster(UpdateClusterRequest) returns (UpdateClusterResponse);
  rpc CheckClusterHealth(CheckClusterHealthRequest) returns (CheckClusterHealthResponse);
  rpc InvalidateAccountCaches(InvalidateAccountCachesRequest) returns (InvalidateCachesResponse);
  rpc InvalidateAllCaches(InvalidateAllCachesRequest) returns (InvalidateCachesResponse);
  rpc ListClusterMigrations(ListClusterMigrationsRequest) returns (ListClusterMigrationsResponse);
}

message ListDeploymentsRequest {
  string namespace = 1; // optional filter
}

message AdminDeployment {
  string name = 1;
  string build_id = 2;
  string namespace = 3;
  string status = 4;
  string created_at = 5;
  string account_name = 6;
  repeated string components = 7;
  string deployment_id = 8;
  string error_message = 9;
  string status_changed_at = 10;
  int32 current_revision = 11;
  string owner_email = 12;
  string cluster_id = 13;           // deployments.cluster_id; empty = primary
  string account_cluster_id = 14;   // accounts.cluster_id; empty = primary
  bool placement_mismatch = 15;     // account vs deployment routing differ
  string account_id = 16;           // owning account UUID
}

message AdminDeploymentEvent {
  string status = 1;
  string message = 2;
  string created_at = 3;
}

message AdminDeploymentRevision {
  int32 revision = 1;
  string build_id = 2;
  string created_at = 3;
}

message ListDeploymentsResponse {
  repeated AdminDeployment deployments = 1;
  int32 count = 2;
}

message GetClusterStatusRequest {
  string namespace = 1; // empty = all namespaces
}

message K8sDeploymentInfo {
  string name = 1;
  string namespace = 2;
  int32 replicas = 3;
  int32 ready_replicas = 4;
  int32 available_replicas = 5;
  map<string, string> labels = 6;
  string created_at = 7;
}

message K8sPodInfo {
  string name = 1;
  string namespace = 2;
  string phase = 3;
  string node_name = 4;
  string pod_ip = 5;
  map<string, string> labels = 6;
  string created_at = 7;
}

message K8sServicePort {
  string name = 1;
  int32 port = 2;
  string target_port = 3;
  string protocol = 4;
}

message K8sServiceInfo {
  string name = 1;
  string namespace = 2;
  string type = 3;
  string cluster_ip = 4;
  repeated string external_ip = 5;
  repeated K8sServicePort ports = 6;
  map<string, string> labels = 7;
  string created_at = 8;
}

message ClusterSummary {
  int32 total_deployments = 1;
  int32 total_pods = 2;
  int32 running_pods = 3;
  int32 pending_pods = 4;
  int32 failed_pods = 5;
  int32 total_services = 6;
}

message GetClusterStatusResponse {
  string timestamp = 1;
  string namespace = 2;
  repeated K8sDeploymentInfo deployments = 3;
  repeated K8sPodInfo pods = 4;
  repeated K8sServiceInfo services = 5;
  ClusterSummary summary = 6;
  string resolved_cluster_id = 7; // K8s API cluster used for this request; empty = primary
}

message ListImagesRequest {}

message ImageInfo {
  string repository = 1;
  string namespace = 2;
  string name = 3;
  repeated string tags = 4;
}

message ListImagesResponse {
  repeated ImageInfo images = 1;
  int32 count = 2;
}

message DeleteDeploymentRequest {
  string namespace = 1;
}

message DeleteDeploymentResponse {
  string status = 1;
}

message RestartDeploymentRequest {
  string namespace = 1;
  string pod = 2;
}

message RestartDeploymentResponse {
  string status = 1;
}

message QueryDatabaseRequest {
  string query = 1;
}

message Row {
  repeated string values = 1;
}

message QueryDatabaseResponse {
  repeated string columns = 1;
  repeated Row rows = 2;
}

message ListAgentsRequest {}

message AdminAgent {
  string account_name = 1;
  string name = 2;
  int32 build_count = 3;
  // Field 4 reserved (was published_build_count)
  string latest_build_id = 5;
  string created_at = 6;
  string updated_at = 7;
}

message ListAgentsResponse {
  repeated AdminAgent agents = 1;
  int32 count = 2;
}

message GetAgentBuildsRequest {
  string account_name = 1;
  string agent_name = 2;
}

message AgentBuild {
  string build_id = 1;
  string published_at = 2;
  string updated_at = 3;
  // Field 4 reserved (was tagged_version)
}

message GetAgentBuildsResponse {
  repeated AgentBuild builds = 1;
  int32 count = 2;
}

message OpenMeterProxyRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  bytes body = 4;
}

message OpenMeterProxyResponse {
  int32 status_code = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}

message HTTPProxyRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  bytes body = 4;
}

message HTTPProxyResponse {
  int32 status_code = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}

message GetAuthConfigRequest {}

message GetAuthConfigResponse {
  string workos_client_id = 1;
  string workos_base_url = 2;
}

message StartRiverUIRequest {}

message StartRiverUIResponse {
  string status = 1;
}

message StopRiverUIRequest {}

message StopRiverUIResponse {
  string status = 1;
}

message GetRiverUIStatusRequest {}

message GetRiverUIStatusResponse {
  bool running = 1;
}

message ListJobKindsRequest {}

message JobKindInfo {
  string kind = 1;
  bytes args_schema = 2; // raw JSON object describing the zero-value args shape
}

message ListJobKindsResponse {
  repeated JobKindInfo kinds = 1;
}

message TriggerJobRequest {
  string kind = 1;
  bytes args_json = 2; // raw JSON object passed to the River job args type
}

message TriggerJobResponse {
  int64 job_id = 1;
}

message GetJobStatesRequest {}

message GetJobStatesResponse {
  int64 available = 1;
  int64 cancelled = 2;
  int64 completed = 3;
  int64 discarded = 4;
  int64 pending = 5;
  int64 retryable = 6;
  int64 running = 7;
  int64 scheduled = 8;
}

message AdminJobError {
  string at = 1;
  int32 attempt = 2;
  string error = 3;
  string trace = 4;
}

message AdminRiverJob {
  int64 id = 1;
  bytes args = 2; // raw River job args JSON
  int32 attempt = 3;
  string attempted_at = 4;
  string created_at = 5;
  repeated AdminJobError errors = 6;
  string finalized_at = 7;
  string kind = 8;
  int32 max_attempts = 9;
  int32 priority = 10;
  string queue = 11;
  string scheduled_at = 12;
  string state = 13;
  repeated string tags = 14;
}

message ListJobsRequest {
  string state = 1;
  repeated string kinds = 2;
  string queue = 3;
  int32 limit = 4;
  int64 before_id = 5;
  int64 anchor_id = 6;
}

message ListJobsResponse {
  repeated AdminRiverJob jobs = 1;
  int64 next_before_id = 2;
  bool has_more = 3;
}

message GetJobRequest {
  int64 id = 1;
}

message GetJobResponse {
  AdminRiverJob job = 1;
}

message CancelJobsRequest {
  repeated int64 ids = 1;
}

message CancelJobsResponse {
  int32 cancelled = 1;
}

message RetryJobsRequest {
  repeated int64 ids = 1;
}

message RetryJobsResponse {
  int32 retried = 1;
}

message AdminQueue {
  string name = 1;
  int64 count_available = 2;
  int64 count_running = 3;
  string paused_at = 4;
  string updated_at = 5;
}

message ListAdminQueuesRequest {}

message ListAdminQueuesResponse {
  repeated AdminQueue queues = 1;
}

message PauseQueueRequest {
  string name = 1;
}

message PauseQueueResponse {}

message ResumeQueueRequest {
  string name = 1;
}

message ResumeQueueResponse {}
}

message QuotaIncreaseRequestProto {
  string id = 1;
  string account_id = 2;
  string account_name = 3;
  string feature_key = 4;
  double current_usage = 5;
  double current_quota = 6;
  double requested_amount = 7;
  string reason = 8;
  string status = 9;
  string requested_by = 10;
  string resolved_by = 11;
  string resolved_at = 12;
  string resolution_note = 13;
  double grant_amount = 14;
  string created_at = 15;
}

message ListQuotaIncreaseRequestsRequest {
  string status = 1;
}

message ListQuotaIncreaseRequestsResponse {
  repeated QuotaIncreaseRequestProto requests = 1;
  int32 count = 2;
}

message ApproveQuotaIncreaseRequest {
  string request_id = 1;
  double grant_amount = 2;
  string note = 3;
}

message ApproveQuotaIncreaseResponse {
  string status = 1;
}

message DenyQuotaIncreaseRequest {
  string request_id = 1;
  string note = 2;
}

message DenyQuotaIncreaseResponse {
  string status = 1;
}

message GetDeploymentEventsRequest {
  string namespace = 1;
}

message GetDeploymentEventsResponse {
  repeated AdminDeploymentEvent events = 1;
}

message WakeUpDeploymentRequest {
  string namespace = 1;
}

message WakeUpDeploymentResponse {
  string status = 1;
}

message RollbackDeploymentRequest {
  string namespace = 1;
  int32 revision = 2;
}

message RollbackDeploymentResponse {
  string status = 1;
}

message ReapplyDeploymentRequest {
  string namespace = 1;
}

message ReapplyDeploymentResponse {
  string status = 1;
  bool cluster_placement_updated = 2; // true when routing was synced from account before enqueue
  string message = 3;                 // optional operator-facing detail
}

message GetDeploymentJobsRequest {
  string deployment_id = 1;
}

message DeploymentJob {
  string kind = 1;
  string state = 2;
  int32 attempt = 3;
  int32 max_attempt = 4;
  string created_at = 5;
  string attempted_at = 6;
  string finalized_at = 7;
  string errors = 8;
  string cluster_id = 9; // river_job.args->>'cluster_id'; empty = primary
  int64 job_id = 10;
}

message GetDeploymentJobsResponse {
  repeated DeploymentJob jobs = 1;
  string last_reconcile_at = 2;
}

message ListClusterMigrationsRequest {
  bool mismatches_only = 1; // when true, events/jobs limited to placement-mismatch deployments
}

message ClusterMigrationEvent {
  string deployment_id = 1;
  string account_name = 2;
  string agent_name = 3;
  string status = 4;
  string message = 5;
  string created_at = 6;
}

message ClusterMigrationJob {
  int64 job_id = 1;
  string kind = 2;
  string state = 3;
  string deployment_id = 4;
  string args_json = 5;
  string errors = 6;
  string created_at = 7;
  string finalized_at = 8;
  int32 attempt = 9;
  int32 max_attempt = 10;
  int64 duration_ms = 11; // finalized - created; 0 if not finalized
  string account_name = 13;
  string agent_name = 14;
  string source_cluster_id = 15; // migrate job: prior routing
  string target_cluster_id = 16; // migrate job: desired routing
  string deploy_cluster_id = 17; // deploy job: cluster_id arg
}

message ListClusterMigrationsResponse {
  repeated ClusterMigrationEvent events = 1;
  repeated ClusterMigrationJob jobs = 2;
  int32 mismatch_count = 3;
}

message ListFeedbackRequest {}

message FeedbackSubmission {
  string id = 1;
  string user_id = 2;
  string user_email = 3;
  string message = 4;
  string page_url = 5;
  string created_at = 6;
}

message ListFeedbackResponse {
  repeated FeedbackSubmission submissions = 1;
  int32 count = 2;
}

message GetPodLogsRequest {
  string deployment_id = 1;
  string pod           = 2; // optional when Loki is configured
  string container     = 3;
  int32  tail_lines    = 4;
  int64  since_unix_ns = 5; // optional start time (Unix nanoseconds)
  int64  until_unix_ns = 6; // optional end time (Unix nanoseconds)
}

message GetPodLogsResponse {
  string logs = 1;
}

message StopDeploymentRequest {
  string namespace = 1;
  string deployment_id = 2;
}

message StopDeploymentResponse {
  string status = 1;
}

// RegisteredCluster describes the primary cluster (synthesized, is_primary=true)
// or an additional cluster row from public.clusters.
//
// The ingress/cert/knowledge fields are required for additional clusters —
// RegisterCluster and UpdateCluster reject empty values, and deploys
// targeting a row with any empty field fail at submit time. The primary
// cluster reads env vars (INGRESS_DOMAIN, ACM_CERTIFICATE_ARN, ...) instead;
// these fields are returned empty for is_primary=true entries.
message RegisteredCluster {
  string id = 1;
  string region = 2;
  string eks_cluster_name = 3;
  string eks_cluster_endpoint = 4;
  bool enabled = 5;
  bool is_primary = 6;
  string created_at = 7;  // RFC3339; empty for primary
  string updated_at = 8;  // RFC3339; empty for primary
  bool healthy = 9;
  string health_error = 10;
  string agent_ingress_domain = 11;
  string agent_acm_certificate_arn = 12;
  string agent_alb_group_name = 13;
  string ingestion_ingress_domain = 14;
  string ingestion_acm_certificate_arn = 15;
  string ingestion_alb_group_name = 16;
  string knowledge_domain = 17;
  string langfuse_base_url_ext = 18;
  string langfuse_vpce_ips = 19; // comma-separated ENI IPs
  string pod_subnet_cidrs = 20;  // comma-separated CIDRs
  // EKS API server's CA certificate (PEM bytes). Captured by the operator at
  // registration time via `aws eks describe-cluster` so astro-server's per-
  // cluster client builder doesn't need cross-account DescribeCluster perms.
  // Empty for is_primary=true entries (primary fetches CA from its in-account
  // DescribeCluster call at boot).
  bytes eks_cluster_ca = 21;
}

message RegisterClusterRequest {
  string id = 1;
  string region = 2;
  string eks_cluster_name = 3;
  string eks_cluster_endpoint = 4;
  bool enabled = 5;
  string agent_ingress_domain = 6;
  string agent_acm_certificate_arn = 7;
  string agent_alb_group_name = 8;
  string ingestion_ingress_domain = 9;
  string ingestion_acm_certificate_arn = 10;
  string ingestion_alb_group_name = 11;
  string knowledge_domain = 12;
  string langfuse_base_url_ext = 13;
  string langfuse_vpce_ips = 14;
  string pod_subnet_cidrs = 15;
  bytes eks_cluster_ca = 16; // PEM CA bytes; required (clusterstore rejects empty)
}

message RegisterClusterResponse {
  RegisteredCluster cluster = 1;
}

message EnableClusterRequest {
  string id = 1;
}

message EnableClusterResponse {
  RegisteredCluster cluster = 1;
}

message DisableClusterRequest {
  string id = 1;
}

message DisableClusterResponse {
  RegisteredCluster cluster = 1;
}

message DeregisterClusterRequest {
  string id = 1;
}

message DeregisterClusterResponse {}

message ListClustersRequest {
  bool enabled_only = 1;
}

message ListClustersResponse {
  repeated RegisteredCluster clusters = 1;
}

message ListAccountsRequest {}

message AdminAccount {
  string id = 1;
  string name = 2;
  string type = 3;
  string owner_user_id = 4;
  int32 member_count = 5;
  bool has_openmeter = 6;
  bool has_langfuse = 7;
  string deleted_at = 8;
  string created_at = 9;
  string updated_at = 10;
  string cluster_id = 11; // empty = primary cluster
}

message ListAccountsResponse {
  repeated AdminAccount accounts = 1;
  int32 count = 2;
}

message RenameAccountRequest {
  string account_id = 1;
  string new_name = 2;
}

message RenameAccountResponse {
  string status = 1;
}

message SetAccountClusterRequest {
  string account_id = 1;
  string cluster_id = 2; // empty clears placement (primary)
}

message SetAccountClusterResponse {
  string status = 1;
  string cluster_id = 2;
  int32 migrations_enqueued = 3;
  repeated string deployment_ids = 4;
}

message UpdateClusterRequest {
  string id = 1;
  string region = 2;
  string eks_cluster_name = 3;
  string eks_cluster_endpoint = 4;
  string agent_ingress_domain = 5;
  string agent_acm_certificate_arn = 6;
  string agent_alb_group_name = 7;
  string ingestion_ingress_domain = 8;
  string ingestion_acm_certificate_arn = 9;
  string ingestion_alb_group_name = 10;
  string knowledge_domain = 11;
  string langfuse_base_url_ext = 12;
  string langfuse_vpce_ips = 13;
  string pod_subnet_cidrs = 14;
  bytes eks_cluster_ca = 15; // PEM CA bytes; required for additional clusters
}

message UpdateClusterResponse {
  RegisteredCluster cluster = 1;
}

message CheckClusterHealthRequest {
  string id = 1;
}

message CheckClusterHealthResponse {
  RegisteredCluster cluster = 1;
}

message InvalidateAccountCachesRequest {
  string account_id = 1;
}

message InvalidateAllCachesRequest {}

message InvalidateCachesResponse {
  int32 accounts_busted = 1;
  int32 deployments_busted = 2;
}
