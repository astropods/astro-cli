message ApproveQuotaIncreaseRequest {
  string request_id = 1;
  double grant_amount = 2;
  string note = 3;
}

message ApproveQuotaIncreaseResponse {
  string status = 1;
}

message DenyQuotaIncreaseRequest {
  string request_id = 1;
  string note = 2;
}

message DenyQuotaIncreaseResponse {
  string status = 1;
}

message GetDeploymentEventsRequest {
  string namespace = 1;
}

message GetDeploymentEventsResponse {
  repeated AdminDeploymentEvent events = 1;
}

message WakeUpDeploymentRequest {
  string namespace = 1;
}

message WakeUpDeploymentResponse {
  string status = 1;
}

message RollbackDeploymentRequest {
  string namespace = 1;
  int32 revision = 2;
}

message RollbackDeploymentResponse {
  string status = 1;
}

message ReapplyDeploymentRequest {
  string namespace = 1;
}

message ReapplyDeploymentResponse {
  string status = 1;
  bool cluster_placement_updated = 2; // true when routing was synced from account before enqueue
  string message = 3;                 // optional operator-facing detail
}

message GetDeploymentJobsRequest {
  string deployment_id = 1;
}

message DeploymentJob {
  string kind = 1;
  string state = 2;
  int32 attempt = 3;
  int32 max_attempt = 4;
  string created_at = 5;
  string attempted_at = 6;
  string finalized_at = 7;
  string errors = 8;
  string cluster_id = 9; // river_job.args->>'cluster_id'; empty = primary
  int64 job_id = 10;
}

message GetDeploymentJobsResponse {
  repeated DeploymentJob jobs = 1;
  reserved 2;
  reserved "last_reconcile_at"; // removed: no periodic reconcile job exists
}

message ListClusterMigrationsRequest {
  bool mismatches_only = 1; // when true, events/jobs limited to placement-mismatch deployments
}

message ClusterMigrationEvent {
  string deployment_id = 1;
  string account_name = 2;
  string agent_name = 3;
  string status = 4;
  string message = 5;
  string created_at = 6;
}

message ClusterMigrationJob {
  int64 job_id = 1;
  string kind = 2;
  string state = 3;
  string deployment_id = 4;
  string args_json = 5;
  string errors = 6;
  string created_at = 7;
  string finalized_at = 8;
  int32 attempt = 9;
  int32 max_attempt = 10;
  int64 duration_ms = 11; // finalized - created; 0 if not finalized
  string account_name = 13;
  string agent_name = 14;
  string source_cluster_id = 15; // migrate job: prior routing
  string target_cluster_id = 16; // migrate job: desired routing
  string deploy_cluster_id = 17; // deploy job: cluster_id arg
}

message ListClusterMigrationsResponse {
  repeated ClusterMigrationEvent events = 1;
  repeated ClusterMigrationJob jobs = 2;
  int32 mismatch_count = 3;
}

message ListFeedbackRequest {}

message FeedbackSubmission {
  string id = 1;
  string user_id = 2;
  string user_email = 3;
  string message = 4;
  string page_url = 5;
  string created_at = 6;
}

message ListFeedbackResponse {
  repeated FeedbackSubmission submissions = 1;
  int32 count = 2;
}

// AlertCondition is one entry in the fixed observation-alert catalog.
message AlertCondition {
  string name        = 1;
  string title       = 2;
  string description = 3;
  string severity    = 4; // "info" | "warning" | "critical"
}

// ActiveAlert is one currently-tracked breach (pending or firing) for a
// deployment+workload, enriched with deployment/account identity and mute state.
message ActiveAlert {
  string deployment_id = 1;
  string agent_name    = 2;
  string account_id    = 3;
  string account_name  = 4;
  string workload      = 5;
  string condition     = 6;
  string title         = 7;
  string severity      = 8;
  string state         = 9;  // "pending" | "firing"
  string active_since  = 10; // RFC3339
  bool   muted         = 11;
  string muted_until   = 12; // RFC3339; set while muted
  string last_notified = 13; // RFC3339; last time this (deployment, condition) paged
}

message ListAlertsRequest {}
message ListAlertsResponse {
  repeated AlertCondition catalog = 1;
  repeated ActiveAlert active     = 2;
}

message ClearAlertRequest {
  string deployment_id = 1;
  string workload      = 2;
  string condition     = 3;
}
message ClearAlertResponse {}

message MuteAlertRequest {
  string deployment_id   = 1;
  string condition       = 2;
  int64  duration_seconds = 3;
}
message MuteAlertResponse {}

message UnmuteAlertRequest {
  string deployment_id = 1;
  string condition     = 2;
}
message UnmuteAlertResponse {}

message GetPodLogsRequest {
  string deployment_id = 1;
  string pod           = 2; // optional when Loki is configured
  string container     = 3;
  int32  tail_lines    = 4;
  int64  since_unix_ns = 5; // optional start time (Unix nanoseconds)
  int64  until_unix_ns = 6; // optional end time (Unix nanoseconds)
}

message GetPodLogsResponse {
  string logs = 1;
}

message StopDeploymentRequest {
  string namespace = 1;
  string deployment_id = 2;
}

message StopDeploymentResponse {
  string status = 1;
}

// RegisteredCluster describes the primary cluster (synthesized, is_primary=true)
// or an additional cluster row from public.clusters.
//
// The ingress / observability fields are required for additional clusters —
// RegisterCluster and UpdateCluster reject empty values, and deploys targeting
// a row with any empty field fail at submit time. The primary cluster reads env
// vars (INGRESS_DOMAIN, INGESTION_INGRESS_DOMAIN, ...) instead; these fields are
// returned empty for is_primary=true entries.
message RegisteredCluster {
  string id = 1;
  string region = 2;
  string eks_cluster_name = 3;
  string eks_cluster_endpoint = 4;
  bool enabled = 5;
  bool is_primary = 6;
  string created_at = 7;  // RFC3339; empty for primary
  string updated_at = 8;  // RFC3339; empty for primary
  bool healthy = 9;
  string health_error = 10;
  string agent_ingress_domain = 11;
  reserved 12, 13, 15, 16, 17;
  reserved "agent_acm_certificate_arn", "agent_alb_group_name",
           "ingestion_acm_certificate_arn", "ingestion_alb_group_name",
           "knowledge_domain";
  string ingestion_ingress_domain = 14;
  string langfuse_base_url_ext = 18;
  string langfuse_vpce_ips = 19; // comma-separated ENI IPs
  string pod_subnet_cidrs = 20;  // comma-separated CIDRs
  // EKS API server's CA certificate (PEM bytes). Captured by the operator at
  // registration time via `aws eks describe-cluster` so astro-server's per-
  // cluster client builder doesn't need cross-account DescribeCluster perms.
  // Empty for is_primary=true entries (primary fetches CA from its in-account
  // DescribeCluster call at boot).
  bytes eks_cluster_ca = 21;
  // IPv6 counterpart to pod_subnet_cidrs. Empty for IPv4-only clusters.
  string pod_subnet_ipv6_cidrs = 22;
}

message RegisterClusterRequest {
  string id = 1;
  string region = 2;
  string eks_cluster_name = 3;
  string eks_cluster_endpoint = 4;
  bool enabled = 5;
  string agent_ingress_domain = 6;
  reserved 7, 8, 10, 11, 12;
  reserved "agent_acm_certificate_arn", "agent_alb_group_name",
           "ingestion_acm_certificate_arn", "ingestion_alb_group_name",
           "knowledge_domain";
  string ingestion_ingress_domain = 9;
  string langfuse_base_url_ext = 13;
  string langfuse_vpce_ips = 14;
  string pod_subnet_cidrs = 15;
  bytes eks_cluster_ca = 16; // PEM CA bytes; required (clusterstore rejects empty)
  string pod_subnet_ipv6_cidrs = 17; // IPv6 counterpart to pod_subnet_cidrs; empty for IPv4-only clusters
}

message RegisterClusterResponse {
  RegisteredCluster cluster = 1;
}

message EnableClusterRequest {
  string id = 1;
}

message EnableClusterResponse {
  RegisteredCluster cluster = 1;
}

message DisableClusterRequest {
  string id = 1;
}

message DisableClusterResponse {
  RegisteredCluster cluster = 1;
}

message DeregisterClusterRequest {
  string id = 1;
}

message DeregisterClusterResponse {}

// ClusterBlocker is a single account or deployment row still referencing a
// cluster via an ON DELETE RESTRICT foreign key, preventing deregistration.
message ClusterBlocker {
  string id = 1;
  string name = 2;
  string status = 3; // empty for accounts; deployment status otherwise
}

message GetClusterBlockersRequest {
  string id = 1;
}

message GetClusterBlockersResponse {
  int32 account_count = 1;
  repeated ClusterBlocker accounts = 2;
  int32 deployment_count = 3;
  repeated ClusterBlocker deployments = 4;
}

message ListClustersRequest {
  bool enabled_only = 1;
}

message ListClustersResponse {
  repeated RegisteredCluster clusters = 1;
}

message ListAccountsRequest {}

message AdminAccount {
  string id = 1;
  string name = 2;
  string type = 3;
  string owner_user_id = 4;
  int32 member_count = 5;
  reserved 6; // was has_openmeter
  bool has_langfuse = 7;
  string deleted_at = 8;
  string created_at = 9;
  string updated_at = 10;
  string cluster_id = 11; // empty = primary cluster
  string billing_status = 12; // active | past_due | suspended; empty = never billed
}

message ListAccountsResponse {
  repeated AdminAccount accounts = 1;
  int32 count = 2;
}

message GetAccountRequest {
  string account_id = 1;
}

// AccountBillingInfo reflects account_billing_status plus the raw billing-provider
// linkage IDs. status is empty when the account has no billing row (never charged).
// Customer IDs are surfaced verbatim — this is an admin-only view.
message AccountBillingInfo {
  string status = 1; // active | past_due | suspended
  string reason = 2;
  string dunning_since = 3; // RFC3339, empty if not in dunning
  bool alert_active = 4;
  string updated_at = 5;
  string metronome_customer_id = 6; // hosted billing linkage
  string stripe_customer_id = 7;    // card vault (saved payment method)
  string bifrost_customer_id = 8;
}

// AccountResourceLimit carries current usage and the effective limit for one
// quota-managed resource. limit: -1 unlimited, 0 disabled.
message AccountResourceLimit {
  string resource = 1;
  int64 used = 2;
  int64 limit = 3;
}

message AccountMemberInfo {
  string user_id = 1;
  string email = 2;
  string created_at = 3;
  bool is_owner = 4;
}

message GetAccountResponse {
  AdminAccount account = 1;
  AccountBillingInfo billing = 2;
  repeated AccountResourceLimit limits = 3;
  repeated AccountMemberInfo members = 4;
  string langfuse_project_id = 5; // empty when Langfuse is not connected
}

message GetAccountMetronomeAliasesRequest {
  string account_id = 1;
}

message RecoverAccountMetronomeAliasesRequest {
  string account_id = 1;
}

message RegisterAccountMetronomeRequest {
  string account_id = 1;
}

message RegisterAccountMetronomeResponse {
  string metronome_customer_id = 1;
}

message RecoverAccountLangfuseRequest {
  string account_id = 1;
}

message RecoverAccountLangfuseResponse {
  string langfuse_project_id = 1;
}

message RecoverAccountBifrostRequest {
  string account_id = 1;
}

message RecoverAccountBifrostResponse {
  string bifrost_customer_id = 1;
}

// MetronomeAliasStatus reports whether an account's Metronome customer carries
// the ingest aliases it should ({account_id, bifrost_customer_id}). Live check
// against the Metronome API.
message GetAccountBillingDetailRequest {
  string account_id = 1;
}

// BillingContract is one Metronome contract covering the customer now.
message BillingContract {
  string id = 1;
  string name = 2;
  string rate_card_id = 4;
  string starting_at = 5;
  string ending_before = 6; // empty when open-ended
}

// BillingProvisionJob is the account's most recent provisioning attempt. A
// cancelled job with a blocked error is the state an operator has to clear.
message BillingProvisionJob {
  int64 id = 1;
  string state = 2;
  int32 attempt = 3;
  string created_at = 4;
  string finalized_at = 5; // empty while still running
  string last_error = 6;
}

// BillingSpend is the customer's money position. Each amount carries a presence
// flag: zero and absent are different, and only one of them is a fact.
message BillingSpend {
  string currency = 1;           // credit type name, e.g. USD
  double credit_remaining = 2;
  bool has_credit = 3;
  double current_spend = 4;      // open period's draft invoice total
  string current_period_end = 5;
  bool has_current_spend = 6;
  double last_invoice_total = 7;
  string last_invoice_at = 8;
  bool has_last_invoice = 9;
}

// BillingCard is the saved payment method, brand and last four only.
message BillingCard {
  string brand = 1;
  string last4 = 2;
  int32 exp_month = 3;
  int32 exp_year = 4;
}

message GetAccountBillingDetailResponse {
  AccountBillingInfo billing = 1;
  string provisioned_at = 2;      // empty until provisioning completed
  bool enforced = 3;              // BILLING_GATE_ENFORCE on this server
  bool workloads_suspended = 4;   // read from the deployments, not from status
  string coverage = 5;            // covered | none | unknown
  repeated BillingContract contracts = 6;
  BillingProvisionJob provision_job = 7;
  BillingCard card = 8;
  BillingSpend spend = 12;
  string metronome_url = 9;       // vendor dashboard, empty without a customer
  string stripe_url = 10;
  // warnings carries per-source failures so one vendor being down degrades the
  // view instead of failing the whole request.
  repeated string warnings = 11;
}

message RetryBillingProvisionRequest {
  string account_id = 1;
}

message RetryBillingProvisionResponse {
  string status = 1; // enqueued | already_provisioned
}

message ForceBillingResumeRequest {
  string account_id = 1;
}

message ForceBillingResumeResponse {
  string status = 1; // enqueued | nothing_suspended
}

message MetronomeAliasStatus {
  bool configured = 1;         // provider available and account has a Metronome customer
  bool ok = 2;                 // all expected aliases present
  repeated string expected = 3;
  repeated string actual = 4;
  repeated string missing = 5;
  string error = 6;            // set when the Metronome lookup failed
}

message RenameAccountRequest {
  string account_id = 1;
  string new_name = 2;
}

message RenameAccountResponse {
  string status = 1;
}

message SetAccountClusterRequest {
  string account_id = 1;
  string cluster_id = 2; // empty clears placement (primary)
}

message SetAccountClusterResponse {
  string status = 1;
  string cluster_id = 2;
  // Setting the cluster no longer migrates deployments as a side effect —
  // see MigrateAccountDeployments.
  reserved 3, 4;
  reserved "migrations_enqueued", "deployment_ids";
}

message MigrateAccountDeploymentsRequest {
  string account_id = 1;
}

message MigrateAccountDeploymentsResponse {
  int32 migrations_enqueued = 1;
  repeated string deployment_ids = 2;
}

message UpdateClusterRequest {
  string id = 1;
  string region = 2;
  string eks_cluster_name = 3;
  string eks_cluster_endpoint = 4;
  string agent_ingress_domain = 5;
  reserved 6, 7, 9, 10, 11;
  reserved "agent_acm_certificate_arn", "agent_alb_group_name",
           "ingestion_acm_certificate_arn", "ingestion_alb_group_name",
           "knowledge_domain";
  string ingestion_ingress_domain = 8;
  string langfuse_base_url_ext = 12;
  string langfuse_vpce_ips = 13;
  string pod_subnet_cidrs = 14;
  bytes eks_cluster_ca = 15; // PEM CA bytes; required for additional clusters
  string pod_subnet_ipv6_cidrs = 16; // IPv6 counterpart to pod_subnet_cidrs; empty for IPv4-only clusters
}

message UpdateClusterResponse {
  RegisteredCluster cluster = 1;
}

message CheckClusterHealthRequest {
  string id = 1;
}

message CheckClusterHealthResponse {
  RegisteredCluster cluster = 1;
}

message InvalidateAccountCachesRequest {
  string account_id = 1;
}

message InvalidateAllCachesRequest {}

message InvalidateCachesResponse {
  int32 accounts_busted = 1;
  int32 deployments_busted = 2;
}

message RefreshMessagingCacheRequest {}

message RefreshMessagingCacheResponse {
  string image = 1;   // pull-through cache image path that was evicted
  string message = 2; // operator-facing status detail
}

// ListOutboundDomains aggregates the destinations agents call, fleet-wide,
// so brand-icon coverage can be prioritised against real traffic.
message ListOutboundDomainsRequest {
  int32 days = 1;  // lookback window; defaults to 30, capped at 90
  int32 limit = 2; // top N by request count; defaults to 200, capped at 2000
}

message OutboundDomain {
  string domain = 1;          // registrable domain (eTLD+1)
  int64 request_count = 2;    // total requests across all deployments
  int32 deployment_count = 3; // distinct deployments that called it
  repeated string hosts = 4;  // busiest server_address values, truncated
  int32 host_count = 5;       // distinct hosts observed, before truncation
}

message ListOutboundDomainsResponse {
  repeated OutboundDomain domains = 1;
  string window = 2; // the lookback actually queried, e.g. "30d"
}
