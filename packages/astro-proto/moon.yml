layer: "library"
language: "go"

tasks:
  # Regenerate Go code from proto definitions (requires buf CLI).
  generate:
    command: "buf generate"
    inputs:
      - "proto/**/*.proto"
      - "buf.gen.yaml"
    outputs:
      - "admin/v1/admin.pb.go"
      - "admin/v1/admin_grpc.pb.go"
    options:
      cache: false

  deps:
    script: "go mod download && go mod tidy"
    inputs:
      - "go.mod"
    outputs:
      - "go.sum"
