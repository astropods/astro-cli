language: "typescript"
type: "library"

tasks:
  build:
    command: "bun run tsc"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "/tsconfig.base.json"
    outputs:
      - "dist"
    deps:
      - "^:build"

  test:
    command: "bun test"
    inputs:
      - "src/**/*"
    deps:
      - "build"
