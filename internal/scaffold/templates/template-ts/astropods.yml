# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: {{.Name}}

agent:
  build:
    context: .
    dockerfile: Dockerfile
{{- if or .AIGateway (.HasIntegration "anthropic") (.HasIntegration "openai")}}

models:
{{- if .AIGateway}}
  # Astro AI Gateway — managed model access (injects ASTRO_GATEWAY_URL +
  # ASTRO_GATEWAY_API_KEY at deploy). List selectable models below; the deployer
  # picks one and it is injected as MODEL_DEFAULT.
  default:
    provider: gateway
    models: [claude-sonnet-4-6]
{{- end}}
{{- range .Integrations}}
{{- if eq . "anthropic"}}
  anthropic:
    provider: anthropic
{{- else if eq . "openai"}}
  openai:
    provider: openai
{{- end}}
{{- end}}
{{- end}}
{{- if or (eq .Template "mastra") (gt (len .Knowledge) 0)}}

knowledge:
{{- if eq .Template "mastra"}}
  # Platform-managed Postgres, holding agent memory, the task list, schedules, and
  # traces. The container filesystem is read-only, so none of that can live in a
  # local SQLite/DuckDB file. Injects POSTGRES_HOST, PORT, USER, PASSWORD, and DB
  # (this provider has no single POSTGRES_URL).
  #
  # The key is project-scoped on purpose: locally the volume is named
  # `knowledge-<key>-data` with no project prefix, so two projects sharing a key
  # share one PGDATA directory — Postgres then skips initdb, ignores the injected
  # POSTGRES_DB, and the agent fails with `3D000 database does not exist`.
  {{.Name}}-db:
    provider: postgres
{{- end}}
{{- if .HasKnowledge "qdrant"}}
  docs:
    provider: qdrant
{{- end}}
{{- if .HasKnowledge "redis"}}
  cache:
    provider: redis
{{- end}}
{{- if .HasKnowledge "neo4j"}}
  graph:
    provider: neo4j
{{- end}}
{{- end}}
{{- if .HasIntegration "github"}}

integrations:
  github:
    provider: github
{{- end}}
{{- if gt (len .Ingestions) 0}}

ingestion:
{{- range .Ingestions}}
  {{.}}:
    container:
      build:
        context: .
        dockerfile: ingestion/{{.}}/Dockerfile
{{- if eq . "webhook"}}
      port: 3001
{{- end}}
    trigger:
      type: {{.}}
{{- end}}
{{- end}}
{{- if gt (len .Interfaces) 0}}

dev:
  interfaces:
    messaging:
      adapters: [{{- range $i, $v := .Interfaces}}{{if $i}}, {{end}}{{$v}}{{- end}}]
{{- end}}
