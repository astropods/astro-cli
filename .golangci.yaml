version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - dogsled
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - makezero
    - mirror
    - misspell
    - sloglint
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - usestdlibvars
    - usetesting
  exclusions:
    paths:
      - ".*_test\\.go$"
